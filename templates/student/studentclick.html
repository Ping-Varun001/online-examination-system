<!DOCTYPE html>
{% load static %}
<html lang="en" class="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Portal</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          animation: {
            'fade-up': 'fadeUp 0.8s ease-out',
            'float': 'float 6s ease-in-out infinite',
          },
          keyframes: {
            fadeUp: {
              '0%': { opacity: '0', transform: 'translateY(30px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-20px)' },
            },
          },
        },
      },
    }
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    .glass-hero {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    /* Gradient orbs */
    .orb-1 { position: absolute; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(99,102,241,0.15), transparent 70%); top: -50px; right: -50px; }
    .orb-2 { position: absolute; width: 250px; height: 250px; border-radius: 50%; background: radial-gradient(circle, rgba(6,182,212,0.1), transparent 70%); bottom: -30px; left: -30px; }
  </style>
</head>

<body class="bg-slate-950 font-sans text-slate-200 antialiased min-h-screen flex flex-col">

  {% include "exam/navbar.html" %}

  <!-- Hero Section -->
  <div class="flex-1 flex items-center justify-center px-4 py-16 md:py-20">

    <!-- Background decorative elements -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
      <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-500/5 rounded-full blur-3xl animate-float"></div>
      <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-cyan-500/5 rounded-full blur-3xl animate-float" style="animation-delay: -3s;"></div>
    </div>

    <div class="relative glass-hero rounded-3xl p-8 md:p-14 max-w-2xl w-full text-center animate-fade-up shadow-2xl shadow-black/20 overflow-hidden">

      <!-- Orbs -->
      <div class="orb-1"></div>
      <div class="orb-2"></div>

      <!-- Content -->
      <div class="relative z-10">
        <!-- Icon -->
        <div class="w-20 h-20 rounded-3xl bg-gradient-to-br from-indigo-500 to-cyan-400 flex items-center justify-center mx-auto mb-6 shadow-2xl shadow-indigo-500/30 animate-float">
          <i class="fas fa-user-graduate text-3xl text-white"></i>
        </div>

        <h1 class="text-3xl md:text-5xl font-extrabold text-white mb-3">
          Hello Student 👋
        </h1>

        <p class="text-lg md:text-xl text-slate-300 mb-2 font-medium">
          Welcome to the Online Examination System
        </p>

        <p class="text-sm text-slate-400 mb-10 max-w-md mx-auto leading-relaxed">
          Attempt exams, track your performance, and view results — all in one secure platform.
        </p>

        <!-- CTA Buttons -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
          <a href="studentsignup"
             class="group w-full sm:w-auto inline-flex items-center justify-center gap-2 px-8 py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-indigo-500 text-white font-bold text-sm hover:shadow-2xl hover:shadow-indigo-500/30 hover:-translate-y-1 transition-all duration-500 no-underline">
            <i class="fas fa-user-plus group-hover:scale-110 transition-transform duration-300"></i>
            Create Your Account
          </a>

          <a href="studentlogin"
             class="group w-full sm:w-auto inline-flex items-center justify-center gap-2 px-8 py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-400 text-white font-bold text-sm hover:shadow-2xl hover:shadow-emerald-500/30 hover:-translate-y-1 transition-all duration-500 no-underline">
            <i class="fas fa-sign-in-alt group-hover:translate-x-1 transition-transform duration-300"></i>
            Login Now
          </a>
        </div>
      </div>

    </div>
  </div>

  {% include "exam/footer.html" %}

</body>
</html>
