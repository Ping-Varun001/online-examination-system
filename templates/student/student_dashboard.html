{% extends 'student/studentbase.html' %}
{% block content %}

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 4 -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">

  <!-- Font Awesome -->
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6fb;
    }

    a {
      text-decoration: none !important;
    }

    .dashboard-wrapper {
      padding: 30px;
      min-height: 85vh;
    }

    .dashboard-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 30px;
      color: #1f2937;
    }

    /* Card */
    .stat-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.12);
      transition: all 0.35s ease;
      height: 100%;
    }

    .stat-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 25px 55px rgba(0,0,0,0.18);
    }

    .stat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .stat-title {
      font-size: 14px;
      font-weight: 600;
      color: #6b7280;
      letter-spacing: 0.6px;
    }

    .stat-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #fff;
    }

    .icon-exam {
      background: linear-gradient(135deg, #2563eb, #60a5fa);
    }

    .icon-question {
      background: linear-gradient(135deg, #f59e0b, #fbbf24);
    }

    .stat-value {
      font-size: 36px;
      font-weight: 700;
      color: #111827;
    }

    .stat-footer {
      margin-top: 10px;
      font-size: 14px;
      color: #2563eb;
      font-weight: 500;
    }


    /* Animation */
    .fade-in {
      animation: fadeUp 0.7s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .dashboard-wrapper {
        padding: 20px;
      }
    }
  </style>
</head>
<!-- Back Button -->

<div class="dashboard-wrapper">
  <div class="container-fluid">

    <div class="dashboard-title">Student Dashboard</div>

    <div class="row">

      <!-- Available Exams -->
      <div class="col-md-6 mb-4 fade-in">
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-title">AVAILABLE EXAMS</div>
            <div class="stat-icon icon-exam">
              <i class="fa fa-book"></i>
            </div>
          </div>

          <div class="stat-value">{{ total_course }}</div>
          <div class="stat-footer"><a href="/student/student-exam">Ready to attempt →</a></div>
        </div>
      </div>

      <!-- Total Questions -->
      <div class="col-md-6 mb-4 fade-in">
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-title">TOTAL QUESTIONS</div>
            <div class="stat-icon icon-question">
              <i class="fa fa-question-circle"></i>
            </div>
          </div>

          <div class="stat-value">{{ total_question }}</div>
          <div class="stat-footer">Across all exams →</div>
        </div>
      </div>

    </div>
  </div>
</div>

{% endblock content %}
 {% include "exam/footer.html" %}
