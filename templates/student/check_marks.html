{% extends 'student/studentbase.html' %}
{% block content %}
{% load static %}

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 4 -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">

  <!-- Font Awesome -->
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6fb;
    }

    a {
      text-decoration: none !important;
    }

    .page-wrapper {
      min-height: 85vh;
      padding: 30px;
    }

    .page-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 25px;
      color: #1f2937;
    }

    .table-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.12);
    }

    .table thead {
      background: linear-gradient(135deg, #2563eb, #60a5fa);
      color: #ffffff;
    }

    .table thead th {
      font-weight: 600;
      text-align: center;
      vertical-align: middle;
      border: none;
    }

    .table tbody td {
      text-align: center;
      vertical-align: middle;
      border-top: 1px solid #e5e7eb;
      font-size: 14px;
    }

    .course-name {
      font-weight: 600;
      color: #111827;
      text-align: left;
    }

    .badge-marks {
      background: #10b981;
      padding: 6px 12px;
      border-radius: 14px;
      color: #fff;
      font-size: 12px;
    }

    .badge-attempt {
      background: #f59e0b;
      padding: 6px 12px;
      border-radius: 14px;
      color: #fff;
      font-size: 12px;
    }
    
  </style>
</head>

<div class="page-wrapper">
  <div class="container-fluid">

    <div class="page-title text-center text-md-left">
      My Exam Results
    </div>

    <div class="table-card">

      <!-- Bootstrap responsive wrapper -->
      <div class="table-responsive">
        <table class="table table-hover table-bordered mb-0">

          <thead>
            <tr>
              <th class="text-nowrap">Course</th>
              <th class="text-nowrap">Total Marks</th>
              <th class="text-nowrap">Attempt</th>
              <th class="text-nowrap">Exam Date</th>
            </tr>
          </thead>

          <tbody>
            {% for t in results %}
            <tr>
              <td class="course-name text-nowrap">{{ t.exam }}</td>

              <td class="text-nowrap">
                <span class="badge-marks">
                  {{ t.marks }} / {{ total_marks }}
                </span>
              </td>

              <td class="text-nowrap">
                <span class="badge-attempt">
                  Attempt {{ forloop.counter }}
                </span>
              </td>

              <td class="text-nowrap">{{ t.date }}</td>
            </tr>
            {% endfor %}
          </tbody>

        </table>
      </div>

    </div>

  </div>
</div>

{% endblock content %}
