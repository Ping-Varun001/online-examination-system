<!DOCTYPE html>
{% load widget_tweaks %}
<html lang="en" class="dark">

<head>
  <meta charset="utf-8">
  <title>Student Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          animation: {
            'fade-up': 'fadeUp 0.7s ease-out',
          },
          keyframes: {
            fadeUp: {
              '0%': { opacity: '0', transform: 'translateY(25px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
          },
        },
      },
    }
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .input-dark {
      background: rgba(255, 255, 255, 0.04) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      color: #e2e8f0 !important;
      border-radius: 0.75rem !important;
      padding: 0.75rem 1rem !important;
      font-size: 0.875rem !important;
      transition: all 0.3s ease !important;
      height: auto !important;
    }
    .input-dark:focus {
      border-color: rgba(99, 102, 241, 0.5) !important;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15), 0 0 20px rgba(99, 102, 241, 0.1) !important;
      outline: none !important;
      background: rgba(255, 255, 255, 0.06) !important;
    }
    .input-dark::placeholder {
      color: #64748b !important;
    }
    
  </style>
</head>

<body class="bg-slate-950 font-sans text-slate-200 antialiased min-h-screen flex flex-col">

  {% include "exam/navbar.html" %}

  <!-- Background Orbs -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/3 left-1/3 w-80 h-80 bg-indigo-500/5 rounded-full blur-3xl"></div>
    <div class="absolute bottom-1/3 right-1/3 w-72 h-72 bg-cyan-500/5 rounded-full blur-3xl"></div>
  </div>

  <!-- Login Section -->
  <div class="flex-1 flex items-center justify-center px-4 py-16 md:py-20">
    <div class="glass-card rounded-3xl p-8 md:p-10 w-full max-w-md animate-fade-up shadow-2xl shadow-black/20 relative overflow-hidden">

      <!-- Decorative gradient -->
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-indigo-500 via-cyan-400 to-indigo-500"></div>

      <!-- Header -->
      <div class="text-center mb-8">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-cyan-400 flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/25">
          <i class="fas fa-sign-in-alt text-xl text-white"></i>
        </div>
        <h1 class="text-2xl font-bold text-white">Student Login</h1>
        <p class="text-sm text-slate-400 mt-1">Sign in to access your exam portal</p>
      </div>

      <!-- Form -->
      <form method="post" autocomplete="off" class="space-y-5">
        {% csrf_token %}

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Username</label>
          <input 
  type="text" 
  name="username" 
  placeholder="Enter your username"
  class="input-dark w-full"
  required
/>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Password</label>
          
<input 
  type="password" 
  name="password" 
  placeholder="Enter your password"
  class="input-dark w-full"
  required
/>
        </div>

        <button type="submit"
                class="w-full flex items-center justify-center gap-2 py-3.5 rounded-xl bg-gradient-to-r from-indigo-600 to-indigo-500 text-white font-bold text-sm hover:shadow-xl hover:shadow-indigo-500/25 hover:-translate-y-0.5 transition-all duration-300 mt-2 group">
          <i class="fas fa-arrow-right group-hover:translate-x-1 transition-transform duration-200"></i>
          Login
        </button>

        {% if form.errors %}
        <div class="mt-4 p-4 rounded-xl bg-red-500/10 border border-red-500/20 flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-red-500/20 flex items-center justify-center flex-shrink-0">
            <i class="fas fa-exclamation-circle text-xs text-red-400"></i>
          </div>
          <p class="text-sm text-red-300">Invalid username or password. Please try again.</p>
        </div>
        {% endif %}
      </form>

      <!-- Register Link -->
      <div class="mt-6 text-center">
        <p class="text-sm text-slate-400">
          Don't have an account?
          <a href="{% url 'studentsignup' %}" class="text-indigo-400 hover:text-indigo-300 font-semibold transition-colors duration-200 no-underline">
            Register here
          </a>
        </p>
      </div>

    </div>
  </div>

  {% include "exam/footer.html" %}

</body>
</html>
