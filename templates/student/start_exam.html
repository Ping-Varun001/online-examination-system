{% extends 'student/studentbase.html' %}
{% block content %}
{% load static %}

<div class="animate-fade-up max-w-4xl mx-auto">

  <!-- Exam Card -->
  <div class="glass-strong rounded-2xl overflow-hidden">

    <!-- Header -->
    <div class="bg-gradient-to-r from-indigo-600/20 to-purple-600/10 border-b border-white/10 p-6 text-center">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center mx-auto mb-3 shadow-lg shadow-indigo-500/30">
        <i class="fas fa-edit text-lg text-white"></i>
      </div>
      <h2 class="text-xl md:text-2xl font-bold text-white">
        Course: {{ course.course_name }}
      </h2>
      <p class="text-xs text-slate-400 mt-1">Answer all questions carefully</p>
    </div>

    <!-- Form -->
    <form autocomplete="off"
          onsubmit="return saveAns()"
          action="/student/calculate-marks"
          method="POST"
          class="p-5 md:p-8">

      {% csrf_token %}
      <input type="hidden" name="force_submit" id="force_submit" value="0">

      <!-- Questions -->
      <div class="space-y-5">
        {% for q in questions %}
        <div class="glass rounded-2xl p-5 border-l-4 border-indigo-500 hover:bg-white/[0.04] transition-all duration-300 group">

          <!-- Question Header -->
          <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-2 mb-4">
            <div class="flex items-start gap-3 flex-1">
              <span class="flex-shrink-0 w-8 h-8 rounded-lg bg-indigo-500/20 flex items-center justify-center text-xs font-bold text-indigo-400">
                {{ forloop.counter }}
              </span>
              <p class="text-sm font-semibold text-white leading-relaxed pt-1">{{ q.question }}</p>
            </div>
            <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-xs font-bold text-indigo-400 whitespace-nowrap self-start">
              <i class="fas fa-star text-[8px]"></i>
              {{ q.marks }} Marks
            </span>
          </div>

          <!-- Options -->
          <div class="space-y-2 ml-0 sm:ml-11">
            <label class="flex items-center gap-3 p-3 rounded-xl bg-white/[0.02] border border-white/5 hover:bg-indigo-500/5 hover:border-indigo-500/20 cursor-pointer transition-all duration-200 group/option">
              <input type="radio" name="{{ forloop.counter }}" value="Option1"
                     class="w-4 h-4 text-indigo-500 bg-slate-800 border-slate-600 focus:ring-indigo-500 focus:ring-2 flex-shrink-0">
              <span class="text-sm text-slate-300 group-hover/option:text-white transition-colors duration-200">{{ q.option1 }}</span>
            </label>

            <label class="flex items-center gap-3 p-3 rounded-xl bg-white/[0.02] border border-white/5 hover:bg-indigo-500/5 hover:border-indigo-500/20 cursor-pointer transition-all duration-200 group/option">
              <input type="radio" name="{{ forloop.counter }}" value="Option2"
                     class="w-4 h-4 text-indigo-500 bg-slate-800 border-slate-600 focus:ring-indigo-500 focus:ring-2 flex-shrink-0">
              <span class="text-sm text-slate-300 group-hover/option:text-white transition-colors duration-200">{{ q.option2 }}</span>
            </label>

            <label class="flex items-center gap-3 p-3 rounded-xl bg-white/[0.02] border border-white/5 hover:bg-indigo-500/5 hover:border-indigo-500/20 cursor-pointer transition-all duration-200 group/option">
              <input type="radio" name="{{ forloop.counter }}" value="Option3"
                     class="w-4 h-4 text-indigo-500 bg-slate-800 border-slate-600 focus:ring-indigo-500 focus:ring-2 flex-shrink-0">
              <span class="text-sm text-slate-300 group-hover/option:text-white transition-colors duration-200">{{ q.option3 }}</span>
            </label>

            <label class="flex items-center gap-3 p-3 rounded-xl bg-white/[0.02] border border-white/5 hover:bg-indigo-500/5 hover:border-indigo-500/20 cursor-pointer transition-all duration-200 group/option">
              <input type="radio" name="{{ forloop.counter }}" value="Option4"
                     class="w-4 h-4 text-indigo-500 bg-slate-800 border-slate-600 focus:ring-indigo-500 focus:ring-2 flex-shrink-0">
              <span class="text-sm text-slate-300 group-hover/option:text-white transition-colors duration-200">{{ q.option4 }}</span>
            </label>
          </div>

        </div>
        {% endfor %}
      </div>

      <!-- Submit Button -->
      <div class="mt-8">
        <button type="submit"
                class="w-full flex items-center justify-center gap-3 py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-cyan-500 text-white font-bold text-base hover:shadow-2xl hover:shadow-indigo-500/30 hover:-translate-y-1 transition-all duration-500 group">
          <i class="fas fa-paper-plane group-hover:translate-x-1 transition-transform duration-300"></i>
          Submit Answers
        </button>
      </div>

    </form>
  </div>
</div>

<!-- JS UNTOUCHED -->
<script>
function saveAns(){
  var ele = document.getElementsByTagName('input');
  for(let i = 0; i < ele.length; i++) {
    if(ele[i].type === "radio" && ele[i].checked){
      document.cookie = ele[i].name + "=" + ele[i].value;
    }
  }
  return true;
}

history.pushState(null, null, location.href);
window.onpopstate = function () {
  history.pushState(null, null, location.href);
};

document.addEventListener("keydown", function (e) {
  if (e.key === "F5" || (e.ctrlKey && e.key.toLowerCase() === "r")) {
    e.preventDefault();
    alert("Refreshing is disabled during the exam.");
  }
});

let examActive = true;
document.addEventListener("visibilitychange", function () {
  if (document.hidden && examActive) {
    forceSubmit();
  }
});
window.addEventListener("blur", function () {
  if (examActive) {
    forceSubmit();
  }
});

function forceSubmit() {
  examActive = false;
  document.getElementById("force_submit").value = "1";
  document.querySelector("form").submit();
}
</script>

{% endblock content %}
