{% extends 'student/studentbase.html' %}
{% block content %}
{% load static %}

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 4 -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6fb;
    }

    .exam-wrapper {
      min-height: 85vh;
      padding: 30px;
    }

    .exam-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.12);
      animation: fadeUp 0.6s ease;
    }

    .exam-title {
      text-align: center;
      font-weight: 700;
      margin-bottom: 30px;
      color: #1f2937;
    }

    .question-card {
      background: #f9fafb;
      border-radius: 14px;
      padding: 20px 22px;
      margin-bottom: 25px;
      border-left: 5px solid #2563eb;
    }

    .question-text {
      font-weight: 600;
      color: #111827;
      margin-bottom: 5px;
    }

    .question-marks {
      font-size: 13px;
      color: #2563eb;
      font-weight: 500;
      text-align: right;
    }

    .form-check {
      padding: 8px 12px;
      margin: 6px 0;
      border-radius: 10px;
      transition: background 0.2s ease;
    }

    .form-check:hover {
      background: #eef2ff;
    }

    .form-check-input {
      margin-top: 6px;
    }

    .submit-btn {
      margin-top: 30px;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 30px;
      background: linear-gradient(135deg, #2563eb, #60a5fa);
      border: none;
      color: #fff;
      transition: 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(37,99,235,0.4);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 576px) {
      .exam-card {
        padding: 25px 20px;
      }
    }
    .back-btn {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  padding: 8px 18px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 500;
  color: #374151;
  transition: all 0.3s ease;
  box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

.back-btn i {
  margin-right: 6px;
}

.back-btn:hover {
  background: #2563eb;
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(37,99,235,0.25);
}
  </style>
</head>
<!-- Back Button -->
<div class="container mt-4">
  <button onclick="history.back()" class="back-btn">
    <i class="fa fa-arrow-left"></i> Back
  </button>
</div>
<div class="exam-wrapper">
  <div class="container">
    <div class="exam-card">

      <h2 class="exam-title">
        Course: {{ course.course_name }}
      </h2>

      <form class="form" autocomplete="off"
      onsubmit="return saveAns()"
      action="/student/calculate-marks"
      method="POST">
        {% csrf_token %}
        <input type="hidden" name="force_submit" id="force_submit" value="0">
        {% for q in questions %}
        <div class="question-card">
          <div class="d-flex justify-content-between">
            <div class="question-text">
              {{ forloop.counter }}. {{ q.question }}
            </div>
            <div class="question-marks">
              {{ q.marks }} Marks
            </div>
          </div>

          <div class="form-check">
            <input class="form-check-input" type="radio"
                   name="{{ forloop.counter }}"
                   value="Option1">
            <label class="form-check-label">
              {{ q.option1 }}
            </label>
          </div>

          <div class="form-check">
            <input class="form-check-input" type="radio"
                   name="{{ forloop.counter }}"
                   value="Option2">
            <label class="form-check-label">
              {{ q.option2 }}
            </label>
          </div>

          <div class="form-check">
            <input class="form-check-input" type="radio"
                   name="{{ forloop.counter }}"
                   value="Option3">
            <label class="form-check-label">
              {{ q.option3 }}
            </label>
          </div>

          <div class="form-check">
            <input class="form-check-input" type="radio"
                   name="{{ forloop.counter }}"
                   value="Option4">
            <label class="form-check-label">
              {{ q.option4 }}
            </label>
          </div>
        </div>
        {% endfor %}

        <button type="submit" class="submit-btn">
          Submit Answers
        </button>

      </form>
    </div>
  </div>
</div>

<script>
/* ================= SAVE ANSWERS ================= */
function saveAns(){
  var ele = document.getElementsByTagName('input');
  for(let i = 0; i < ele.length; i++) {
    if(ele[i].type === "radio" && ele[i].checked){
      setCookie(ele[i].name, ele[i].value, 3);
    }
  }
  return true;
}

function setCookie(cname, cvalue, exdays) {
  var d = new Date();
  d.setTime(d.getTime() + (exdays*24*60*60*1000));
  document.cookie = cname + "=" + cvalue + ";expires=" + d.toUTCString() + ";path=/";
}

/* ================= BLOCK BACK BUTTON ================= */
history.pushState(null, null, location.href);
window.onpopstate = function () {
  history.pushState(null, null, location.href);
};

/* ================= BLOCK REFRESH ================= */
document.addEventListener("keydown", function (e) {
  if (e.key === "F5" || (e.ctrlKey && e.key.toLowerCase() === "r")) {
    e.preventDefault();
    alert("Refreshing is disabled during the exam.");
  }
});

/* ================= TAB / APP SWITCH DETECTION ================= */
let examActive = true;
let warningShown = false;

document.addEventListener("visibilitychange", function () {
  if (document.hidden && examActive) {
    showWarningPopup();
  }
});

window.addEventListener("blur", function () {
  if (examActive) {
    showWarningPopup();
  }
});

/* ================= WARNING POPUP ================= */
function showWarningPopup() {

  if (warningShown) return;
  warningShown = true;
  examActive = false;

  let choice = confirm(
    "⚠️ Exam Warning!\n\n" +
    "Tab switching or app switching is not allowed during the exam.\n\n" +
    "OK  → Stay & continue exam\n" +
    "Cancel → Leave exam (Marks = 0)"
  );

  if (choice) {

    examActive = true;

    setTimeout(() => {
      warningShown = false;
    }, 1000);

  } else {

    forceSubmitExam();
  }
}

/* ================= FORCE SUBMIT ================= */
function forceSubmitExam() {
  document.getElementById("force_submit").value = "1";
  document.querySelector("form").submit();
}
</script>

{% endblock content %}
