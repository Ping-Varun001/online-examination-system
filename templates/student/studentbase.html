<!DOCTYPE html>
{% load static %}
<html lang="en" class="dark">

<head>
  <meta charset="utf-8">
  <title>Online Examination</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['DM Sans', 'Inter', 'sans-serif'],
          },
          animation: {
            'fade-up': 'fadeUp 0.6s ease-out',
            'fade-in': 'fadeIn 0.5s ease-out',
            'slide-in': 'slideIn 0.3s ease-out',
            'glow-pulse': 'glowPulse 2s ease-in-out infinite',
          },
          keyframes: {
            fadeUp: {
              '0%': { opacity: '0', transform: 'translateY(25px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideIn: {
              '0%': { transform: 'translateX(-100%)' },
              '100%': { transform: 'translateX(0)' },
            },
            glowPulse: {
              '0%, 100%': { boxShadow: '0 0 15px rgba(99,102,241,0.3)' },
              '50%': { boxShadow: '0 0 30px rgba(99,102,241,0.6)' },
            },
          },
        },
      },
    }
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* Smooth transitions */
    * { scroll-behavior: smooth; }

    /* Glassmorphism utility */
    .glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-strong {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>

<body class="bg-slate-950 font-sans text-slate-200 antialiased">

  <!-- ================= NAVBAR ================= -->
  <nav class="fixed top-0 left-0 right-0 h-16 z-[1000] glass-strong border-b border-white/10 flex items-center justify-between px-4 md:px-6">

    <!-- Left: Hamburger + Brand -->
    <div class="flex items-center gap-3">
      <!-- Mobile Menu Toggle -->
      <button class="lg:hidden text-slate-300 hover:text-white text-xl p-1 rounded-lg hover:bg-white/10 transition-all duration-200"
              onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
      </button>

      <!-- Brand -->
      <a href="/student/student-dashboard" class="flex items-center gap-3 group no-underline">
        <div class="w-9 h-9 bg-gradient-to-br from-indigo-500 to-cyan-400 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/25 group-hover:shadow-indigo-500/40 transition-all duration-300">
          <i class="fas fa-graduation-cap text-white text-sm"></i>
        </div>
        <div class="hidden sm:block">
          <div class="text-sm font-bold text-white leading-tight">Examination</div>
          <div class="text-[10px] text-slate-400 font-medium tracking-wider uppercase">Portal</div>
        </div>
      </a>
    </div>

    <!-- Right: User + Logout -->
    <div class="flex items-center gap-3">
      <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-white/5 border border-white/10">
        <div class="w-6 h-6 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center">
          <i class="fas fa-user text-[10px] text-white"></i>
        </div>
        <span class="text-xs font-medium text-slate-300">{{ request.user.first_name }}</span>
      </div>

      <a href="{% url 'logout' %}"
         class="group flex items-center gap-2 px-4 py-2 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 hover:bg-red-500/20 hover:text-red-300 hover:border-red-500/30 transition-all duration-300 text-xs font-semibold no-underline">
        <i class="fas fa-sign-out-alt text-xs group-hover:translate-x-0.5 transition-transform duration-200"></i>
        <span class="hidden sm:inline">Logout</span>
      </a>
    </div>
  </nav>

  <!-- ================= SIDEBAR ================= -->
  <aside id="sidebar"
         class="fixed top-16 left-0 w-[260px] h-[calc(100vh-4rem)] z-[2000] glass-strong border-r border-white/10 flex flex-col transition-transform duration-300 ease-in-out
                lg:translate-x-0 -translate-x-full">

    <!-- Profile Section -->
    <div class="flex flex-col items-center py-6 px-4 border-b border-white/10">
      <div class="relative mb-3">
        <div class="w-[72px] h-[72px] rounded-2xl bg-gradient-to-br from-indigo-500/20 to-cyan-500/20 border border-white/10 p-1 animate-glow-pulse">
          <img src="{% static 'images/teacher.png' %}" alt="Profile"
               class="w-full h-full rounded-xl object-cover">
        </div>
        <div class="absolute -bottom-1 -right-1 w-5 h-5 bg-emerald-500 rounded-full border-2 border-slate-950 flex items-center justify-center">
          <i class="fas fa-check text-[8px] text-white"></i>
        </div>
      </div>
      <h4 class="text-sm font-bold text-white">{{ request.user.first_name }}</h4>
      <span class="text-[11px] text-slate-400 mt-0.5 px-2 py-0.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 font-medium">Student</span>
    </div>

    <!-- Navigation Menu -->
    <nav class="flex-1 py-4 px-3 space-y-1 overflow-y-auto">
      <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-3 mb-2">Navigation</p>

      <a href="/student/student-dashboard"
         class="group flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-gradient-to-r hover:from-indigo-500/10 hover:to-transparent transition-all duration-300 no-underline">
        <div class="w-8 h-8 rounded-lg bg-white/5 group-hover:bg-indigo-500/20 flex items-center justify-center transition-all duration-300">
          <i class="fas fa-home text-xs text-slate-400 group-hover:text-indigo-400 transition-colors duration-300"></i>
        </div>
        Dashboard
      </a>

      <a href="/student/student-exam"
         class="group flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-gradient-to-r hover:from-cyan-500/10 hover:to-transparent transition-all duration-300 no-underline">
        <div class="w-8 h-8 rounded-lg bg-white/5 group-hover:bg-cyan-500/20 flex items-center justify-center transition-all duration-300">
          <i class="fas fa-book-open text-xs text-slate-400 group-hover:text-cyan-400 transition-colors duration-300"></i>
        </div>
        Examination
      </a>

      <a href="/student/student-marks"
         class="group flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-gradient-to-r hover:from-purple-500/10 hover:to-transparent transition-all duration-300 no-underline">
        <div class="w-8 h-8 rounded-lg bg-white/5 group-hover:bg-purple-500/20 flex items-center justify-center transition-all duration-300">
          <i class="fas fa-chart-bar text-xs text-slate-400 group-hover:text-purple-400 transition-colors duration-300"></i>
        </div>
        My Marks
      </a>
    </nav>

    <!-- Sidebar Footer -->
    <div class="p-4 border-t border-white/10">
      <div class="p-3 rounded-xl bg-gradient-to-r from-indigo-500/10 to-cyan-500/10 border border-white/5">
        <p class="text-[11px] text-slate-400 text-center">Exam Portal v2.0</p>
      </div>
    </div>
  </aside>

  <!-- ================= OVERLAY ================= -->
  <div id="overlay"
       class="fixed inset-0 top-16 bg-black/50 backdrop-blur-sm z-[1500] hidden lg:hidden"
       onclick="toggleSidebar()">
  </div>

  <!-- ================= MAIN CONTENT ================= -->
  <main class="fixed top-16 lg:left-[260px] left-0 right-0 bottom-0 z-[100] flex flex-col">
    <div class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8">
      {% block content %}{% endblock %}
    </div>

    {% include 'exam/footer.html' %}
  </main>

  <!-- ================= SIDEBAR TOGGLE JS ================= -->
  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      sidebar.classList.toggle('-translate-x-full');
      overlay.classList.toggle('hidden');
    }

    // Close sidebar on resize to desktop
    window.addEventListener('resize', function () {
      if (window.innerWidth >= 1024) {
        document.getElementById('sidebar').classList.remove('-translate-x-full');
        document.getElementById('overlay').classList.add('hidden');
      } else {
        document.getElementById('sidebar').classList.add('-translate-x-full');
      }
    });
  </script>

</body>
</html>
