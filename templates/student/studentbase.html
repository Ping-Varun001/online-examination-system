<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Online Examination</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

  <style>
    :root{
      --primary:#2563eb;
      --bg:#f5f7fb;
      --white:#ffffff;
      --border:#e6e9f0;
      --text:#1f2937;
      --muted:#6b7280;
      --nav-height:70px;
    }

    body{
      margin:0;
      font-family:'DM Sans',sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    /* ================= NAVBAR ================= */

    .navbar{
      position:fixed;
      top:0;
      left:0;
      right:0;
      height:var(--nav-height);
      background:var(--white);
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 20px;
      z-index:1000;
    }

    .menu-toggle{
      display:none;
      font-size:20px;
      cursor:pointer;
      margin-right:10px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .logo-icon{
      width:36px;
      height:36px;
      background:linear-gradient(135deg,#2563eb,#60a5fa);
      color:#fff;
      border-radius:8px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .logout-btn{
      background:var(--primary);
      color:#fff;
      padding:6px 14px;
      border-radius:6px;
      font-size:13px;
      text-decoration:none;
    }

    /* ================= SIDEBAR ================= */

    .sidebar{
      position:fixed;
      top:var(--nav-height);
      left:0;
      width:240px;
      height:calc(100vh - var(--nav-height));
      background:var(--white);
      border-right:1px solid var(--border);
      padding:20px 0;
      z-index:2000; /* FIX */
    }

    .profile{
      text-align:center;
      border-bottom:1px solid var(--border);
      padding-bottom:20px;
      margin-bottom:15px;
    }

    .profile img{
      width:70px;
      height:70px;
      border-radius:50%;
      object-fit:cover;
      margin-bottom:8px;
    }

    .profile h4{
      font-size:14px;
      font-weight:600;
    }

    .profile span{
      font-size:12px;
      color:var(--muted);
    }

    .menu a{
      display:flex;
      align-items:center;
      padding:12px 20px;
      margin:4px 15px;
      border-radius:8px;
      font-size:14px;
      color:var(--muted);
      text-decoration:none;
    }

    .menu a i{
      width:20px;
      margin-right:12px;
    }

    .menu a:hover{
      background:#eef2ff;
      color:var(--primary);
    }

    /* ================= OVERLAY ================= */

    .overlay{
      position:fixed;
      top:var(--nav-height);
      left:0;
      right:0;
      bottom:0;
      background:rgba(0,0,0,0.4);
      z-index:1500;
      display:none;
    }

    .overlay.active{
      display:block;
    }

    /* ================= MAIN CONTENT ================= */

    .main{
      position:fixed;
      top:var(--nav-height);
      left:240px;
      right:0;
      bottom:0;
      display:flex;
      flex-direction:column;
      z-index:100;
    }

    .content-wrapper{
      flex:1;
      padding:25px;
      overflow-y:auto;
    }

    /* ================= MOBILE ================= */

    @media(max-width:992px){
      .menu-toggle{display:block;}

      .sidebar{
        left:-240px;
        transition:0.3s;
      }

      .sidebar.active{
        left:0;
      }

      .main{
        left:0;
      }
    }
  </style>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<div class="navbar">
  <div style="display:flex;align-items:center;">
    <span class="menu-toggle" onclick="toggleSidebar()">
      <i class="fas fa-bars"></i>
    </span>

    <div class="brand">
      <div class="logo-icon">
        <i class="fas fa-graduation-cap"></i>
      </div>
      <div>
        <strong>Examination</strong><br>
        <small>Portal</small>
      </div>
    </div>
  </div>

  <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
</div>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar" id="sidebar">
  <div class="profile">
    <img src="{% static 'images/teacher.png' %}" alt="Profile" width="80">
    <h6>{{ request.user.first_name }}</h6>
    <small>(Student)</small>
  </div>

  <div class="menu">
    <a href="/student/student-dashboard">
      <i class="fas fa-home"></i> Dashboard
    </a>
    <a href="/student/student-exam">
      <i class="fas fa-book-open"></i> Examination
    </a>
    <a href="/student/student-marks">
      <i class="fas fa-chart-bar"></i> My Marks
    </a>
  </div>
</div>

<!-- ================= OVERLAY ================= -->
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- ================= CONTENT ================= -->
<div class="main">
  <div class="content-wrapper">
    {% block content %}{% endblock %}
  </div>

  {% include 'exam/footer.html' %}
</div>

<script>
function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("active");
  document.getElementById("overlay").classList.toggle("active");
}
</script>

</body>
</html>
