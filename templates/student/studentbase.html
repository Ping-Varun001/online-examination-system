<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Online Examination</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f4f6fb;
    }

    a {
      text-decoration: none;
    }

    /* ================= HEADER ================= */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: #111827;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 1000;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-toggle {
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      display: none;
    }

    .header h3 {
      color: #fff;
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap; /* ✅ prevents line break */
    }

    .logout-btn {
      background: #ef4444;
      padding: 8px 18px;
      border-radius: 20px;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      transition: 0.3s ease;
    }

    .logout-btn:hover {
      background: #dc2626;
      color: #fff;
    }

    /* ================= SIDEBAR ================= */
    .sidebar {
      position: fixed;
      top: 64px;
      left: 0;
      width: 240px;
      height: 100%;
      background: #1f2937;
      padding-top: 25px;
      transition: 0.3s ease;
      z-index: 999;
    }

    .profile {
      text-align: center;
      margin-bottom: 25px;
    }

    .profile img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
      border: 3px solid #2563eb;
    }

    .profile h4 {
      color: #fff;
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    .profile span {
      font-size: 12px;
      color: #9ca3af;
    }

    .menu a {
      display: flex;
      align-items: center;
      padding: 14px 30px;
      color: #d1d5db;
      font-size: 14px;
      transition: 0.3s ease;
      white-space: nowrap;
    }

    .menu a i {
      width: 20px;
      margin-right: 12px;
    }

    .menu a:hover {
      background: #2563eb;
      color: #fff;
    }

    /* ================= CONTENT ================= */
    .content {
      margin-left: 240px;
      margin-top: 64px;
      padding: 30px;
      min-height: calc(100vh - 64px);
      transition: 0.3s ease;
    }

    /* ================= OVERLAY ================= */
    .overlay {
      display: none;
      position: fixed;
      top: 64px;
      left: 0;
      width: 100%;
      height: calc(100% - 64px);
      background: rgba(0, 0, 0, 0.4);
      z-index: 998;
    }

    .overlay.active {
      display: block;
    }

    /* ================= MOBILE ================= */
    @media (max-width: 768px) {
      .menu-toggle {
        display: inline-block;
      }

      .sidebar {
        left: -240px;
      }

      .sidebar.active {
        left: 0;
      }

      .content {
        margin-left: 0;
      }

      .header h3 {
        font-size: 16px;
      }

      .logout-btn {
        padding: 6px 12px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<!-- ================= HEADER ================= -->
<div class="header">
  <div class="header-left">
    <span class="menu-toggle" onclick="toggleSidebar()">
      <i class="fas fa-bars"></i>
    </span>
    <h3>Online Examination</h3>
  </div>
  <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
</div>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar" id="sidebar">
  <div class="profile">
  <img src="{% static 'images/teacher.png' %}" alt="Profile">
  <h4>{{ request.user.first_name }}</h4>
  <span>Student</span>
</div>

  <div class="menu">
    <a href="/student/student-dashboard" onclick="toggleSidebar()">
      <i class="fas fa-home"></i> Dashboard
    </a>
    <a href="/student/student-exam" onclick="toggleSidebar()">
      <i class="fas fa-book"></i> Examination
    </a>
    <a href="/student/student-marks" onclick="toggleSidebar()">
      <i class="fas fa-chart-line"></i> My Marks
    </a>
  </div>
</div>

<!-- ================= OVERLAY ================= -->
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- ================= CONTENT ================= -->
<div class="content">
  {% block content %}{% endblock content %}
</div>

<!-- ================= SCRIPT ================= -->
<script>
  function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("active");
    document.getElementById("overlay").classList.toggle("active");
  }
</script>

</body>
</html>
