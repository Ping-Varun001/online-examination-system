{% extends 'exam/adminbase.html' %}
{% load widget_tweaks %}
{% block content %}


<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
    <link href="http://netdna.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">
    <style type="text/css">
  a:link {
  text-decoration: none;
}

body {
  background: #f8fafc;
  font-family: 'Poppins', sans-serif;
}

/* Back Button */
.back-btn {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  padding: 8px 18px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 500;
  color: #374151;
  transition: all 0.3s ease;
  box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

.back-btn i {
  margin-right: 6px;
}

.back-btn:hover {
  background: #2563eb;
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(37,99,235,0.25);
}

/* Modern Cards */
.card {
  border: none;
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
  overflow: hidden;
  transition: all 0.3s ease;
  height: 100%;
}

.card:hover {
  transform: translateY(-8px);
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
}

.card .card-block {
  padding: 32px;
}

.order-card h6 {
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 1px;
  opacity: 0.9;
}

.order-card h2 {
  font-weight: 700;
  font-size: 28px;
  margin-top: 12px;
}

.order-card i {
  font-size: 26px;
  opacity: 0.9;
}

/* Icon spacing fix */
.f-left {
  margin-right: 10px;
}

/* Modern Gradients */
.bg-c-blue {
  background: linear-gradient(135deg, #3b82f6, #1e40af);
  color: #fff;
}

.bg-c-green {
  background: linear-gradient(135deg, #10b981, #047857);
  color: #fff;
}

.bg-c-yellow {
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color: #fff;
}

.bg-c-pink {
  background: linear-gradient(135deg, #ef4444, #b91c1c);
  color: #fff;
}

.container {
  margin-top: 30px;
}

@media (max-width: 768px) {
  .card .card-block {
    padding: 25px;
  }

  .order-card h2 {
    font-size: 22px;
  }
}
</style>

  </head>
<br><br>
  <!-- Back Button -->
<div class="container mt-4">
  <button onclick="history.back()" class="back-btn">
    <i class="fa fa-arrow-left"></i> Back
  </button>
</div>
  <div class="container">
    <div class="row">
      <div class="col-md-4 col-xl-4">
        <a href="admin-view-teacher" style="text-decoration: none;color:white;">
        <div class="card bg-c-blue order-card">
          <div class="card-block">
            <h6 class="m-b-20"> Total Approved Teacher </h6>
            <h2 class="text-right"><i class="fas fa-chalkboard-teacher f-left"></i><span>{{total_teacher}}</span></h2>
          </div>
        </div>
      </a>
      </div>
  
      <div class="col-md-4 col-xl-4">
        <a href="admin-view-pending-teacher" style="text-decoration: none;color:white;">
        <div class="card bg-c-yellow order-card">
          <div class="card-block">
            <h6 class="m-b-20">Total Pending Teacher </h6>
            <h2 class="text-right"><i class="fas fa-sync-alt f-left"></i><span>{{pending_teacher}}</span></h2>
          </div>
        </div>
      </a>
      </div>
  
      <div class="col-md-4 col-xl-4">
        <a href="admin-view-teacher-salary" style="text-decoration: none;color:white;">
        <div class="card bg-c-green order-card">
          <div class="card-block">
            <h6 class="m-b-20">Total Teacher Salary</h6>
            <h2 class="text-right"><i class="fas fa-dollar-sign f-left"></i><span>${{salary}}</span></h2>
          </div>
        </div>
      </a>
      </div>
  
     
    </div>
  </div>


<br><br><br><br><br><br><br><br><br><br>

<script src="http://netdna.bootstrapcdn.com/bootstrap/4.0.0-beta/js/bootstrap.min.js"></script>


{% endblock content %}
