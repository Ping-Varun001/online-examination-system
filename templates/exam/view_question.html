{% extends 'exam/adminbase.html' %}
{% block content %}
{% load static %}

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 4 -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">

  <!-- Font Awesome -->
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6fb;
    }

    a {
      text-decoration: none !important;
    }

    .page-wrapper {
      min-height: 85vh;
      padding: 30px;
    }

    .page-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 25px;
      color: #1f2937;
    }

    .table-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.12);
      animation: fadeUp 0.6s ease;
    }

    .table thead {
      background: #1f2937;
      color: #ffffff;
    }

    .table thead th {
      font-weight: 600;
      text-align: center;
      vertical-align: middle;
      border: none;
    }

    .table tbody td {
      text-align: center;
      vertical-align: middle;
      border-top: 1px solid #e5e7eb;
    }

    .question-text {
      text-align: left;
      font-weight: 500;
      color: #111827;
    }

    .badge-marks {
      background: #2563eb;
      padding: 6px 12px;
      border-radius: 12px;
      color: #fff;
      font-size: 12px;
    }

    .btn-delete {
      background: #ef4444;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      color: #fff;
      transition: 0.3s ease;
    }

    .btn-delete:hover {
      background: #dc2626;
      transform: scale(1.05);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .page-wrapper {
        padding: 20px;
      }
    }
    .back-btn {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  padding: 8px 18px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 500;
  color: #374151;
  transition: all 0.3s ease;
  box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

.back-btn i {
  margin-right: 6px;
}

.back-btn:hover {
  background: #2563eb;
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(37,99,235,0.25);
}
  </style>
</head>
<!-- Back Button -->
<div class="container mt-4">
  <button onclick="history.back()" class="back-btn">
    <i class="fa fa-arrow-left"></i> Back
  </button>
</div>
<div class="page-wrapper">
  <div class="container-fluid">

    <div class="page-title">Questions</div>

    <div class="table-card">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>Question</th>
              <th>Marks</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody>
            {% for c in questions %}
            <tr>
              <td class="question-text">{{ c.question }}</td>
              <td>
                <span class="badge-marks">{{ c.marks }}</span>
              </td>
              <td>
                <a href="{% url 'delete-question' c.id %}" class="btn-delete">
                  <i class="fa fa-trash"></i>
                </a>
              </td>
            </tr>
            {% endfor %}
          </tbody>

        </table>
      </div>
    </div>

  </div>
</div>

{% endblock content %}
