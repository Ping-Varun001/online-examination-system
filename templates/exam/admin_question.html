{% extends 'exam/adminbase.html' %}
{% block content %}

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 4 -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">

  <!-- Font Awesome -->
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

 <style>
  body {
    font-family: 'Inter', sans-serif;
    background: #f8fafc;
  }

  a {
    text-decoration: none !important;
  }

  .dashboard-wrapper {
    padding: 40px 30px;
    min-height: 85vh;
  }

  .dashboard-title {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 35px;
    color: #111827;
    position: relative;
  }

  .dashboard-title::after {
    content: "";
    width: 60px;
    height: 4px;
    background: #2563eb;
    display: block;
    margin-top: 8px;
    border-radius: 5px;
  }

  /* Card Design */
  .action-card {
    background: #ffffff;
    border-radius: 20px;
    padding: 35px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
    transition: all 0.35s ease;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid #f1f5f9;
  }

  .action-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.12);
  }

  .card-text h6 {
    font-size: 13px;
    font-weight: 600;
    color: #9ca3af;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .card-text h3 {
    font-size: 22px;
    font-weight: 700;
    color: #1f2937;
    margin: 0;
  }

  /* Icon Box */
  .card-icon {
    width: 60px;
    height: 60px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: #fff;
    transition: all 0.3s ease;
  }

  .icon-add {
    background: linear-gradient(135deg, #3b82f6, #60a5fa);
  }

  .icon-view {
    background: linear-gradient(135deg, #10b981, #34d399);
  }

  .action-card:hover .card-icon {
    transform: scale(1.1);
  }

  @media (max-width: 768px) {
    .dashboard-wrapper {
      padding: 25px 20px;
    }

    .action-card {
      margin-bottom: 20px;
      padding: 28px;
    }

    .card-text h3 {
      font-size: 20px;
    }
  }
  .back-btn {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  padding: 8px 18px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 500;
  color: #374151;
  transition: all 0.3s ease;
  box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

.back-btn i {
  margin-right: 6px;
}

.back-btn:hover {
  background: #2563eb;
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(37,99,235,0.25);
}
</style>

</head>
<!-- Back Button -->
<div class="container mt-4">
  <button onclick="history.back()" class="back-btn">
    <i class="fa fa-arrow-left"></i> Back
  </button>
</div>
<div class="dashboard-wrapper">
  <div class="container-fluid">

    <div class="dashboard-title">Question Management</div>

    <div class="row">

      <!-- Add Question -->
      <div class="col-md-6 mb-4">
        <a href="admin-add-question">
          <div class="action-card">
            <div class="card-text">
              <h6>MANAGE QUESTIONS</h6>
              <h3>Add Question</h3>
            </div>
            <div class="card-icon icon-add">
              <i class="fa fa-plus"></i>
            </div>
          </div>
        </a>
      </div>

      <!-- View Questions -->
      <div class="col-md-6 mb-4">
        <a href="admin-view-question">
          <div class="action-card">
            <div class="card-text">
              <h6>MANAGE QUESTIONS</h6>
              <h3>View Questions</h3>
            </div>
            <div class="card-icon icon-view">
              <i class="fa fa-eye"></i>
            </div>
          </div>
        </a>
      </div>

    </div>
  </div>
</div>

{% endblock content %}
