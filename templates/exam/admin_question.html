{% extends 'exam/adminbase.html' %}
{% block content %}

<div class="animate-fade-up">

  <!-- Back Button -->
  <button onclick="history.back()"
          class="group inline-flex items-center gap-2 px-4 py-2 rounded-xl glass border border-white/10 text-sm font-medium text-slate-400 hover:text-white hover:bg-white/10 transition-all duration-300 mb-6">
    <i class="fas fa-arrow-left text-xs group-hover:-translate-x-1 transition-transform duration-200"></i>
    Back
  </button>

  <!-- Page Header -->
  <div class="mb-8">
    <h1 class="text-2xl md:text-3xl font-bold text-white mb-1">Question Management</h1>
    <p class="text-sm text-slate-400">Add new questions or browse existing question sets.</p>
    <div class="w-14 h-1 bg-gradient-to-r from-red-500 to-orange-400 rounded-full mt-3"></div>
  </div>

  <!-- Action Cards Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <!-- Add Question Card -->
    <a href="admin-add-question" class="group no-underline">
      <div class="glass-strong rounded-2xl p-8 hover:bg-white/[0.07] transition-all duration-500 hover:-translate-y-3 hover:shadow-2xl hover:shadow-indigo-500/10 relative overflow-hidden">

        <!-- Gradient accent -->
        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-indigo-500 to-blue-500 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>

        <div class="flex items-center justify-between">
          <div>
            <p class="text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-1">Manage Questions</p>
            <h3 class="text-xl font-bold text-white group-hover:text-indigo-300 transition-colors duration-300">Add Question</h3>
            <p class="text-sm text-slate-400 mt-2">Create a new MCQ question</p>
          </div>
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-500 to-blue-500 flex items-center justify-center shadow-lg shadow-indigo-500/25 group-hover:shadow-indigo-500/50 group-hover:scale-110 group-hover:-rotate-6 transition-all duration-500">
            <i class="fas fa-plus text-xl text-white"></i>
          </div>
        </div>

        <div class="mt-6 flex items-center gap-2 text-indigo-400 group-hover:text-indigo-300">
          <span class="text-xs font-semibold">Create Now</span>
          <i class="fas fa-arrow-right text-[10px] group-hover:translate-x-1 transition-transform duration-300"></i>
        </div>
      </div>
    </a>

    <!-- View Questions Card -->
    <a href="admin-view-question" class="group no-underline">
      <div class="glass-strong rounded-2xl p-8 hover:bg-white/[0.07] transition-all duration-500 hover:-translate-y-3 hover:shadow-2xl hover:shadow-emerald-500/10 relative overflow-hidden">

        <!-- Gradient accent -->
        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-emerald-500 to-teal-400 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>

        <div class="flex items-center justify-between">
          <div>
            <p class="text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-1">Manage Questions</p>
            <h3 class="text-xl font-bold text-white group-hover:text-emerald-300 transition-colors duration-300">View Questions</h3>
            <p class="text-sm text-slate-400 mt-2">Browse all question sets</p>
          </div>
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/25 group-hover:shadow-emerald-500/50 group-hover:scale-110 group-hover:-rotate-6 transition-all duration-500">
            <i class="fas fa-eye text-xl text-white"></i>
          </div>
        </div>

        <div class="mt-6 flex items-center gap-2 text-emerald-400 group-hover:text-emerald-300">
          <span class="text-xs font-semibold">View All</span>
          <i class="fas fa-arrow-right text-[10px] group-hover:translate-x-1 transition-transform duration-300"></i>
        </div>
      </div>
    </a>

  </div>
</div>

{% endblock content %}
