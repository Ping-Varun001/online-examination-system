{% extends 'exam/adminbase.html' %}
{% block content %}
{% load static %}

<div class="animate-fade-up">

  <!-- Back Button -->
  <button onclick="history.back()"
          class="group inline-flex items-center gap-2 px-4 py-2 rounded-xl glass border border-white/10 text-sm font-medium text-slate-400 hover:text-white hover:bg-white/10 transition-all duration-300 mb-6">
    <i class="fas fa-arrow-left text-xs group-hover:-translate-x-1 transition-transform duration-200"></i>
    Back
  </button>

  <!-- Page Header -->
  <div class="mb-8">
    <h1 class="text-2xl md:text-3xl font-bold text-white mb-1">Exams</h1>
    <p class="text-sm text-slate-400">Select an exam to view student marks.</p>
  </div>

  <!-- Exams Table Card -->
  <div class="glass-strong rounded-2xl overflow-hidden">

    <!-- Desktop Table -->
    <div class="hidden md:block">
      <table class="w-full">
        <thead>
          <tr class="bg-gradient-to-r from-slate-800/80 to-slate-700/50 border-b border-white/10">
            <th class="text-left px-6 py-4 text-xs font-bold text-slate-300 uppercase tracking-wider">Exam Name</th>
            <th class="text-center px-6 py-4 text-xs font-bold text-slate-300 uppercase tracking-wider">Action</th>
          </tr>
        </thead>
        <tbody>
          {% for t in courses %}
          <tr class="border-b border-white/5 hover:bg-white/[0.03] transition-colors duration-200 group">
            <td class="px-6 py-4">
              <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-lg bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center group-hover:bg-cyan-500/20 transition-colors duration-300">
                  <i class="fas fa-book-open text-xs text-cyan-400"></i>
                </div>
                <span class="text-sm font-semibold text-white">{{ t.course_name }}</span>
              </div>
            </td>
            <td class="px-6 py-4 text-center">
              <a href="{% url 'admin-check-marks' t.id %}"
                 class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-gradient-to-r from-indigo-500 to-blue-500 text-white text-xs font-bold hover:shadow-lg hover:shadow-indigo-500/25 hover:-translate-y-0.5 transition-all duration-300 no-underline group/btn">
                <i class="fas fa-eye text-[10px] group-hover/btn:scale-110 transition-transform duration-200"></i>
                View Marks
              </a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

    <!-- Mobile Cards -->
    <div class="md:hidden p-4 space-y-3">
      {% for t in courses %}
      <div class="glass rounded-xl p-4 hover:bg-white/[0.05] transition-all duration-300">
        <div class="flex items-center gap-3 mb-4">
          <div class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center">
            <i class="fas fa-book-open text-xs text-cyan-400"></i>
          </div>
          <span class="text-sm font-semibold text-white flex-1">{{ t.course_name }}</span>
        </div>
        <a href="{% url 'admin-check-marks' t.id %}"
           class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-gradient-to-r from-indigo-500 to-blue-500 text-white text-xs font-bold hover:shadow-lg hover:shadow-indigo-500/25 transition-all duration-300 no-underline">
          <i class="fas fa-eye text-[10px]"></i>
          View Marks
        </a>
      </div>
      {% endfor %}
    </div>

  </div>
</div>

{% endblock content %}
