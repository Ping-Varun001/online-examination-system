<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<style>

/* ================= MATCHING LIGHT FOOTER ================= */

body{
  margin:0;
  font-family:'DM Sans', sans-serif;
}

/* Footer */
.footer{
  background:#ffffff;
  border-top:1px solid #e6e9f0;
  padding:18px 30px;
}

/* Layout */
.footer-container{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:15px;
}

/* Brand Section */
.footer-brand{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:15px;
  font-weight:600;
  color:#1f2937;
}

.footer-brand i{
  color:#2563eb;
  font-size:16px;
}

/* Center Text */
.footer-center{
  font-size:13px;
  color:#6b7280;
}

/* Social Icons */
.footer-social a{
  color:#6b7280;
  margin-left:12px;
  font-size:15px;
  transition:0.3s ease;
}

.footer-social a:hover{
  color:#2563eb;
  transform:translateY(-2px);
}

/* Responsive */
@media(max-width:768px){
  .footer-container{
    flex-direction:column;
    text-align:center;
  }

  .footer-social{
    margin-top:8px;
  }
}

</style>
</head>

<body>

<footer class="footer">

  <div class="footer-container">

    <!-- Left -->
   
    <!-- Center -->
    <div class="footer-center">
      © 2026 Online Examination System. All Rights Reserved.
    </div>

    <!-- Right -->
    <div class="footer-social">
      <a href="#"><i class="fab fa-facebook-f"></i></a>
      <a href="#"><i class="fab fa-twitter"></i></a>
      <a href="#"><i class="fab fa-linkedin-in"></i></a>
    </div>

  </div>

</footer>

</body>
</html>
