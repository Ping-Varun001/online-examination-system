{% extends 'exam/adminbase.html' %}
{% block content %}
{% load static %}

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 3 -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #eef2f7, #f9fafb);
    }

    a:link {
      text-decoration: none;
    }

    .page-wrapper {
      min-height: 85vh;
      padding: 20px;
    }

    .marks-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.15);
      padding: 30px;
      animation: fadeUp 0.6s ease;
    }

    .card-title {
      text-align: center;
      font-weight: 600;
      margin-bottom: 25px;
      color: #2c3e50;
    }

    .table {
      margin-bottom: 0;
    }

    .table thead {
      background: #2c3e50;
      color: #fff;
    }

    .table thead th {
      font-weight: 500;
      text-align: center;
      vertical-align: middle;
    }

    .table tbody td {
      text-align: center;
      vertical-align: middle;
    }

    .badge-attempt {
      background: #17a2b8;
      padding: 6px 10px;
      border-radius: 12px;
      color: #fff;
      font-size: 12px;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Mobile Table Scroll */
    .table-responsive {
      border: none;
    }

    @media (max-width: 768px) {
      .marks-card {
        padding: 20px;
      }
    }
    .back-btn {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  padding: 8px 18px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 500;
  color: #374151;
  transition: all 0.3s ease;
  box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

.back-btn i {
  margin-right: 6px;
}

.back-btn:hover {
  background: #2563eb;
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(37,99,235,0.25);
}
  </style>
</head>
<!-- Back Button -->
<div class="container mt-4">
  <button onclick="history.back()" class="back-btn">
    <i class="fa fa-arrow-left"></i> Back
  </button>
</div>
<div class="page-wrapper">
  <div class="container">
    <div class="marks-card">

      <h3 class="card-title">View Marks</h3>

      <div class="table-responsive">
        <table class="table table-hover table-bordered">
          <thead>
            <tr>
              <th>Course</th>
              <th>Total Marks</th>
              <th>Attempt</th>
              <th>Exam Date</th>
            </tr>
          </thead>

          <tbody>
            {% for t in results %}
            <tr>
              <td>{{ t.exam }}</td>
              <td>{{ t.marks }} / {{ total_marks }}</td>
              <td><span class="badge-attempt">Attempt {{ forloop.counter }}</span></td>
              <td>{{ t.date }}</td>
            </tr>
            {% endfor %}
          </tbody>

        </table>
      </div>

    </div>
  </div>
</div>

{% endblock content %}
