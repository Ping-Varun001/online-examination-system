<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Online Examination</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 4 CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      padding-top: 80px; /* Space for fixed navbar */
      background: #f8f9fa;
    }

    /* Navbar */
    .navbar {
      background: #ffffff;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      z-index: 1000;
    }

    /* Brand */
    .navbar-brand {
      font-size: 22px;
      font-weight: 700;
      color: #212529 !important;
    }

    .navbar-brand i {
      color: #17a2b8;
      margin-right: 6px;
    }

    /* Nav links */
    .nav-link {
      font-size: 15px;
      font-weight: 500;
      color: #343a40 !important;
      margin-left: 20px;
      padding: 8px 16px;
      border-radius: 50px;
      transition: all 0.3s ease;
    }

    .nav-link:hover {
      background-color: #e9f7fa;
      color: #17a2b8 !important;
    }

    .nav-item .active {
      background-color: #17a2b8;
      color: #fff !important;
      font-weight: 600;
    }

    /* Mobile spacing */
    @media (max-width: 767px) {
      .nav-link {
        margin-left: 0;
        margin-top: 8px;
      }
    }

    /* ================= Overlay ================= */
    .nav-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      z-index: 998;
      transition: 0.3s ease;
    }

    .nav-overlay.active {
      display: block;
    }
  </style>
</head>

<body>

<nav class="navbar navbar-expand-md navbar-light fixed-top">
  <div class="container">

    <!-- Brand -->
    <a class="navbar-brand" href="/">
      <i class="fa fa-graduation-cap"></i> Online Examination
    </a>

    <!-- Toggle -->
    <button class="navbar-toggler" type="button">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Links -->
    <div class="collapse navbar-collapse justify-content-end" id="navbarCollapse">
      <ul class="navbar-nav text-center">

        <li class="nav-item">
          <a href="/" class="nav-link">Home</a>
        </li>

        <li class="nav-item">
          <a href="/teacher/teacherclick" class="nav-link">Teacher</a>
        </li>

        <li class="nav-item">
          <a href="/student/studentclick" class="nav-link">Student</a>
        </li>

        <li class="nav-item">
          <a href="/contactus" class="nav-link">Contact</a>
        </li>

      </ul>
    </div>

  </div>
</nav>

<!-- Overlay -->
<div class="nav-overlay" id="navOverlay"></div>

<!-- Scripts -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

<script>
$(document).ready(function () {

  $('.navbar-toggler').on('click', function () {
    $('#navbarCollapse').collapse('toggle');
    $('#navOverlay').toggleClass('active');
  });

  $('.nav-link, #navOverlay').on('click', function () {
    if ($(window).width() < 768) {
      $('#navbarCollapse').collapse('hide');
      $('#navOverlay').removeClass('active');
    }
  });

});
</script>

</body>
</html>
