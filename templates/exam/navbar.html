<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>

  <!-- Bootstrap 4 CSS -->

    }

    /* Navbar container */
    .navbar {
      background: #ffffff;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    /* Brand */
    .navbar-brand {
      font-size: 22px;
      font-weight: 700;
      color: #212529 !important;
    }

    .navbar-brand i {
      color: #17a2b8;

      padding: 8px 16px;
      border-radius: 50px;

    .navbar-toggler {
  border-color: rgba(0,0,0,0.2);
}

.navbar-toggler-icon {

}


    /* Active style (optional) */
    .nav-item .active {
      background-color: #17a2b8;
      color: #fff !important;
      font-weight: 600;
    }

    /* Mobile adjustments */
    @media (max-width: 767px) {
      .nav-link {
        margin-left: 0;
        margin-top: 8px;
      }
    }
  </style>
</head>
