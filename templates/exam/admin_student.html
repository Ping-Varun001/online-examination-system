{% extends 'exam/adminbase.html' %}
{% block content %}

<div class="animate-fade-up">

  <!-- Back Button -->
  <button onclick="history.back()"
          class="group inline-flex items-center gap-2 px-4 py-2 rounded-xl glass border border-white/10 text-sm font-medium text-slate-400 hover:text-white hover:bg-white/10 transition-all duration-300 mb-6">
    <i class="fas fa-arrow-left text-xs group-hover:-translate-x-1 transition-transform duration-200"></i>
    Back
  </button>

  <!-- Page Header -->
  <div class="mb-8">
    <h1 class="text-2xl md:text-3xl font-bold text-white mb-1">Student Management</h1>
    <p class="text-sm text-slate-400">View registered students and track their performance.</p>
  </div>

  <!-- Action Cards Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <!-- Registered Students Card -->
    <a href="admin-view-student" class="group no-underline">
      <div class="glass-strong rounded-2xl p-6 hover:bg-white/[0.07] transition-all duration-500 hover:-translate-y-3 hover:shadow-2xl hover:shadow-indigo-500/10 relative overflow-hidden">

        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-indigo-500 to-purple-500 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>

        <div class="flex items-start justify-between mb-5">
          <div>
            <p class="text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-1">Registered Students</p>
            <p class="text-4xl font-extrabold text-white mt-2 count" data-count="{{ total_student }}">0</p>
          </div>
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/25 group-hover:shadow-indigo-500/50 group-hover:scale-110 transition-all duration-500">
            <i class="fas fa-user-graduate text-xl text-white"></i>
          </div>
        </div>

        <div class="w-full h-1 bg-white/5 rounded-full overflow-hidden mb-3">
          <div class="h-full w-3/4 bg-gradient-to-r from-indigo-500 to-purple-400 rounded-full"></div>
        </div>

        <div class="flex items-center gap-2 text-indigo-400 group-hover:text-indigo-300 transition-colors duration-300">
          <span class="text-sm font-semibold">View Students</span>
          <i class="fas fa-arrow-right text-xs group-hover:translate-x-1 transition-transform duration-300"></i>
        </div>
      </div>
    </a>

    <!-- Student Marks Card -->
    <a href="admin-view-student-marks" class="group no-underline">
      <div class="glass-strong rounded-2xl p-6 hover:bg-white/[0.07] transition-all duration-500 hover:-translate-y-3 hover:shadow-2xl hover:shadow-emerald-500/10 relative overflow-hidden">

        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-emerald-500 to-teal-400 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>

        <div class="flex items-start justify-between mb-5">
          <div>
            <p class="text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-1">Student Marks</p>
            <p class="text-4xl font-extrabold text-white mt-2">View</p>
          </div>
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/25 group-hover:shadow-emerald-500/50 group-hover:scale-110 transition-all duration-500">
            <i class="fas fa-chart-bar text-xl text-white"></i>
          </div>
        </div>

        <div class="w-full h-1 bg-white/5 rounded-full overflow-hidden mb-3">
          <div class="h-full w-1/2 bg-gradient-to-r from-emerald-500 to-teal-400 rounded-full"></div>
        </div>

        <div class="flex items-center gap-2 text-emerald-400 group-hover:text-emerald-300 transition-colors duration-300">
          <span class="text-sm font-semibold">Check Marks</span>
          <i class="fas fa-arrow-right text-xs group-hover:translate-x-1 transition-transform duration-300"></i>
        </div>
      </div>
    </a>

  </div>
</div>

<!-- Count Animation -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".count").forEach(counter => {
      const target = +counter.dataset.count;
      let current = 0;
      const increment = Math.ceil(target / 40);

      function update() {
        current += increment;
        if (current < target) {
          counter.textContent = current;
          requestAnimationFrame(update);
        } else {
          counter.textContent = target;
        }
      }
      update();
    });
  });
</script>

{% endblock content %}
