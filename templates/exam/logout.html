{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Logged Out</title>

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .logout-wrapper {
            min-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .logout-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 45px 35px;
            border-radius: 20px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            animation: fadeUp 0.6s ease;
        }

        .logout-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #28a745, #5ddf8a);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 36px;
            margin: 0 auto 20px;
        }

        .logout-card h2 {
            font-weight: 600;
            margin-bottom: 10px;
            color: #222;
        }

        .logout-card p {
            color: #555;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .btn-home {
            border-radius: 30px;
            padding: 12px 40px;
            font-size: 15px;
            font-weight: 500;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: #fff;
            transition: all 0.3s ease;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(102,126,234,0.5);
            color: #fff;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 576px) {
            .logout-card {
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>

{% include "exam/navbar.html" %}

<div class="logout-wrapper">
    <div class="logout-card">
        <div class="logout-icon">✓</div>
        <h2>Logged Out Successfully</h2>
        <p>You have been safely logged out. Thank you for using our online examination system.</p>

        <a href="/" class="btn btn-home">Back to Home</a>
    </div>
</div>

{% include "exam/footer.html" %}

</body>
</html>
