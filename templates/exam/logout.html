{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <title>Logged Out</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          animation: {
            'fade-up': 'fadeUp 0.7s ease-out',
            'bounce-in': 'bounceIn 0.6s ease-out',
            'float': 'float 6s ease-in-out infinite',
          },
          keyframes: {
            fadeUp: {
              '0%': { opacity: '0', transform: 'translateY(30px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            bounceIn: {
              '0%': { opacity: '0', transform: 'scale(0.3)' },
              '50%': { transform: 'scale(1.05)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-20px)' },
            },
          },
        },
      },
    }
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>

<body class="bg-slate-950 font-sans text-slate-200 antialiased min-h-screen flex flex-col">

  {% include "exam/navbar.html" %}

  <!-- Background Orbs -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/3 left-1/4 w-80 h-80 bg-indigo-500/5 rounded-full blur-3xl animate-float"></div>
    <div class="absolute bottom-1/3 right-1/4 w-72 h-72 bg-emerald-500/5 rounded-full blur-3xl animate-float" style="animation-delay: -3s;"></div>
  </div>

  <!-- Logout Section -->
  <div class="flex-1 flex items-center justify-center px-4 py-16 md:py-20">
    <div class="glass-card rounded-3xl p-8 md:p-14 max-w-xl w-full text-center animate-fade-up shadow-2xl shadow-black/20 relative overflow-hidden">

      <!-- Decorative gradient bar -->
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-emerald-500 via-indigo-500 to-emerald-500"></div>

      <!-- Success Icon -->
      <div class="animate-bounce-in mb-6">
        <div class="w-24 h-24 rounded-3xl bg-gradient-to-br from-emerald-500 to-teal-400 flex items-center justify-center mx-auto shadow-2xl shadow-emerald-500/30">
          <i class="fas fa-check text-4xl text-white"></i>
        </div>
      </div>

      <!-- Content -->
      <h2 class="text-2xl md:text-3xl font-extrabold text-white mb-3">
        Logged Out Successfully
      </h2>

      <p class="text-base text-slate-300 mb-8 max-w-sm mx-auto leading-relaxed">
        You have been safely logged out. Thank you for using our online examination system.
      </p>

      <!-- Divider -->
      <div class="w-20 h-px bg-gradient-to-r from-transparent via-white/20 to-transparent mx-auto mb-8"></div>

      <!-- Security badges -->
      <div class="flex items-center justify-center gap-4 mb-8">
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-full glass border border-white/10">
          <i class="fas fa-shield-alt text-[10px] text-emerald-400"></i>
          <span class="text-[11px] text-slate-400 font-medium">Session Cleared</span>
        </div>
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-full glass border border-white/10">
          <i class="fas fa-lock text-[10px] text-indigo-400"></i>
          <span class="text-[11px] text-slate-400 font-medium">Secured</span>
        </div>
      </div>

      <!-- CTA Button -->
      <a href="/"
         class="inline-flex items-center justify-center gap-3 px-10 py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-indigo-500 text-white font-bold text-sm hover:shadow-2xl hover:shadow-indigo-500/30 hover:-translate-y-1 transition-all duration-500 no-underline group">
        <i class="fas fa-home group-hover:scale-110 transition-transform duration-300"></i>
        Back to Home
      </a>

    </div>
  </div>

  {% include "exam/footer.html" %}

</body>
</html>
