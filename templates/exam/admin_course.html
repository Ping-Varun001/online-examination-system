{% extends 'exam/adminbase.html' %}
{% load widget_tweaks %}
{% block content %}

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 4 -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #eef2f7, #f9fafb);
    }

    a:link {
      text-decoration: none;
    }

    .page-wrapper {
      min-height: 85vh;
      padding: 20px;
    }

    /* Card Base */
    .dashboard-card {
      color: #fff;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.18);
      transition: all 0.35s ease;
      animation: fadeUp 0.7s ease;
    }

    /* Hover Animation */
    .dashboard-card:hover {
      transform: translateY(-10px) scale(1.03);
      box-shadow: 0 28px 60px rgba(0,0,0,0.3);
    }

    /* Gradients */
    .bg-blue {
      background: linear-gradient(135deg, #04868f, #0bbcd6);
    }

    .bg-gray {
      background: linear-gradient(135deg, #57717d, #8fa3ad);
    }

    /* Text & Icon */
    .dashboard-card h6 {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 18px;
      letter-spacing: 0.5px;
    }

    .dashboard-card i {
      font-size: 42px;
      opacity: 0.9;
      transition: transform 0.4s ease;
    }

    .dashboard-card:hover i {
      transform: rotate(-6deg) scale(1.15);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(35px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .dashboard-card {
        padding: 28px;
        margin-bottom: 20px;
      }
    }
    .back-btn {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  padding: 8px 18px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 500;
  color: #374151;
  transition: all 0.3s ease;
  box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

.back-btn i {
  margin-right: 6px;
}

.back-btn:hover {
  background: #2563eb;
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(37,99,235,0.25);
}
  </style>
</head>
<!-- Back Button -->
<div class="container mt-4">
  <button onclick="history.back()" class="back-btn">
    <i class="fa fa-arrow-left"></i> Back
  </button>
</div>
<div class="page-wrapper">
  <div class="container">
    <div class="row">

      <!-- Add Course -->
      <div class="col-md-6">
        <a href="admin-add-course">
          <div class="dashboard-card bg-blue">
            <h6>Add Course</h6>
            <div class="text-right">
              <i class="fa fa-plus-circle"></i>
            </div>
          </div>
        </a>
      </div>

      <!-- View Course -->
      <div class="col-md-6">
        <a href="admin-view-course">
          <div class="dashboard-card bg-gray">
            <h6>View Course</h6>
            <div class="text-right">
              <i class="fa fa-eye"></i>
            </div>
          </div>
        </a>
      </div>

    </div>
  </div>
</div>

{% endblock content %}
