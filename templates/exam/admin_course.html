{% extends 'exam/adminbase.html' %}
{% load widget_tweaks %}
{% block content %}

<div class="animate-fade-up">

  <!-- Back Button -->
  <button onclick="history.back()"
          class="group inline-flex items-center gap-2 px-4 py-2 rounded-xl glass border border-white/10 text-sm font-medium text-slate-400 hover:text-white hover:bg-white/10 transition-all duration-300 mb-6">
    <i class="fas fa-arrow-left text-xs group-hover:-translate-x-1 transition-transform duration-200"></i>
    Back
  </button>

  <!-- Page Header -->
  <div class="mb-8">
    <h1 class="text-2xl md:text-3xl font-bold text-white mb-1">Course Management</h1>
    <p class="text-sm text-slate-400">Add new courses or view existing ones.</p>
  </div>

  <!-- Action Cards Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <!-- Add Course Card -->
    <a href="admin-add-course" class="group no-underline">
      <div class="glass-strong rounded-2xl p-8 hover:bg-white/[0.07] transition-all duration-500 hover:-translate-y-3 hover:shadow-2xl hover:shadow-cyan-500/10 relative overflow-hidden">

        <!-- Gradient accent -->
        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-cyan-500 to-blue-500 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>

        <div class="flex items-start justify-between">
          <div>
            <h3 class="text-lg font-bold text-white mb-2 group-hover:text-cyan-300 transition-colors duration-300">Add Course</h3>
            <p class="text-sm text-slate-400">Create a new course for exams</p>
          </div>
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-cyan-500 to-blue-500 flex items-center justify-center shadow-lg shadow-cyan-500/25 group-hover:shadow-cyan-500/50 group-hover:scale-110 group-hover:-rotate-6 transition-all duration-500">
            <i class="fas fa-plus-circle text-xl text-white"></i>
          </div>
        </div>

        <div class="mt-6 flex items-center gap-2 text-cyan-400 group-hover:text-cyan-300">
          <span class="text-xs font-semibold">Create Now</span>
          <i class="fas fa-arrow-right text-[10px] group-hover:translate-x-1 transition-transform duration-300"></i>
        </div>
      </div>
    </a>

    <!-- View Course Card -->
    <a href="admin-view-course" class="group no-underline">
      <div class="glass-strong rounded-2xl p-8 hover:bg-white/[0.07] transition-all duration-500 hover:-translate-y-3 hover:shadow-2xl hover:shadow-slate-500/10 relative overflow-hidden">

        <!-- Gradient accent -->
        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-slate-400 to-slate-500 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>

        <div class="flex items-start justify-between">
          <div>
            <h3 class="text-lg font-bold text-white mb-2 group-hover:text-slate-300 transition-colors duration-300">View Courses</h3>
            <p class="text-sm text-slate-400">Browse all existing courses</p>
          </div>
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-slate-500 to-slate-600 flex items-center justify-center shadow-lg shadow-slate-500/25 group-hover:shadow-slate-500/50 group-hover:scale-110 group-hover:-rotate-6 transition-all duration-500">
            <i class="fas fa-eye text-xl text-white"></i>
          </div>
        </div>

        <div class="mt-6 flex items-center gap-2 text-slate-400 group-hover:text-slate-300">
          <span class="text-xs font-semibold">View All</span>
          <i class="fas fa-arrow-right text-[10px] group-hover:translate-x-1 transition-transform duration-300"></i>
        </div>
      </div>
    </a>

  </div>
</div>

{% endblock content %}
