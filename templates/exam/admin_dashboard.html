{% extends 'exam/adminbase.html' %}
{% block content %}

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 4 -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">

  <!-- Font Awesome -->
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6fb;
    }

    a {
      text-decoration: none !important;
    }

    .dashboard-wrapper {
      padding: 30px;
      min-height: 85vh;
    }

    .dashboard-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 30px;
      color: #1f2937;
    }

    /* Card */
    .stat-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      transition: all 0.35s ease;
      height: 100%;
    }

    .stat-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 45px rgba(0,0,0,0.15);
    }

    .stat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .stat-title {
      font-size: 14px;
      font-weight: 600;
      color: #6b7280;
      letter-spacing: 0.5px;
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #fff;
    }

    .icon-student { background: linear-gradient(135deg, #6366f1, #818cf8); }
    .icon-teacher { background: linear-gradient(135deg, #10b981, #34d399); }
    .icon-course  { background: linear-gradient(135deg, #0ea5e9, #38bdf8); }
    .icon-question{ background: linear-gradient(135deg, #f43f5e, #fb7185); }

    .stat-value {
      font-size: 34px;
      font-weight: 700;
      color: #111827;
    }

    @media (max-width: 768px) {
      .dashboard-wrapper {
        padding: 20px;
      }
    }
  </style>
</head>

<div class="dashboard-wrapper">
  <div class="container-fluid">

    <div class="dashboard-title">Admin Dashboard</div>

    <div class="row">

      <!-- Students -->
      <div class="col-md-6 col-xl-3 mb-4">
        <a href="admin-view-student">
          <div class="stat-card">
            <div class="stat-header">
              <div class="stat-title">REGISTERED STUDENTS</div>
              <div class="stat-icon icon-student">
                <i class="fa fa-user-graduate"></i>
              </div>
            </div>
            <div class="stat-value">{{ total_student }}</div>
          </div>
        </a>
      </div>

      <!-- Teachers -->
      <div class="col-md-6 col-xl-3 mb-4">
        <a href="admin-view-teacher">
          <div class="stat-card">
            <div class="stat-header">
              <div class="stat-title">TOTAL TEACHERS</div>
              <div class="stat-icon icon-teacher">
                <i class="fa fa-chalkboard-teacher"></i>
              </div>
            </div>
            <div class="stat-value">{{ total_teacher }}</div>
          </div>
        </a>
      </div>

      <!-- Courses -->
      <div class="col-md-6 col-xl-3 mb-4">
        <a href="admin-view-course">
          <div class="stat-card">
            <div class="stat-header">
              <div class="stat-title">TOTAL COURSES</div>
              <div class="stat-icon icon-course">
                <i class="fa fa-book"></i>
              </div>
            </div>
            <div class="stat-value">{{ total_course }}</div>
          </div>
        </a>
      </div>

      <!-- Questions -->
      <div class="col-md-6 col-xl-3 mb-4">
        <a href="admin-view-question">
          <div class="stat-card">
            <div class="stat-header">
              <div class="stat-title">AVAILABLE QUESTIONS</div>
              <div class="stat-icon icon-question">
                <i class="fa fa-question-circle"></i>
              </div>
            </div>
            <div class="stat-value">{{ total_question }}</div>
          </div>
        </a>
      </div>

    </div>
  </div>
</div>

{% endblock content %}
