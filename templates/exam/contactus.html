<!DOCTYPE html>
{% load static %}
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <title>Contact Us</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          animation: {
            'fade-up': 'fadeUp 0.7s ease-out',
            'float': 'float 6s ease-in-out infinite',
          },
          keyframes: {
            fadeUp: {
              '0%': { opacity: '0', transform: 'translateY(30px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-20px)' },
            },
          },
        },
      },
    }
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .input-dark {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      transition: all 0.3s ease;
      width: 100%;
      outline: none;
    }
    .input-dark:focus {
      border-color: rgba(99, 102, 241, 0.5);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15), 0 0 20px rgba(99, 102, 241, 0.1);
      background: rgba(255, 255, 255, 0.06);
    }
    .input-dark::placeholder {
      color: #64748b;
    }
    textarea.input-dark {
      resize: none;
    }
  </style>
</head>

<body class="bg-slate-950 font-sans text-slate-200 antialiased min-h-screen flex flex-col">

  {% include "exam/navbar.html" %}

  <!-- Background Orbs -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-500/5 rounded-full blur-3xl animate-float"></div>
    <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-cyan-500/5 rounded-full blur-3xl animate-float" style="animation-delay: -3s;"></div>
  </div>

  <!-- Contact Section -->
  <div class="flex-1 flex items-center justify-center px-4 py-16 md:py-20">
    <div class="glass-card rounded-3xl p-8 md:p-10 w-full max-w-3xl animate-fade-up shadow-2xl shadow-black/20 relative overflow-hidden">

      <!-- Decorative gradient bar -->
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-indigo-500 via-cyan-400 to-indigo-500"></div>

      <!-- Header -->
      <div class="text-center mb-8">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-cyan-400 flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/25">
          <i class="fas fa-headset text-xl text-white"></i>
        </div>
        <h1 class="text-2xl md:text-3xl font-bold text-white">Free Consultation</h1>
        <p class="text-sm text-slate-400 mt-2">Have questions? We'd love to hear from you.</p>
      </div>

      <!-- Form -->
      <form method="POST" autocomplete="off" class="space-y-5">
        {% csrf_token %}

        {% if form.errors %}
        <div class="p-4 rounded-xl bg-red-500/10 border border-red-500/20 flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-red-500/20 flex items-center justify-center flex-shrink-0">
            <i class="fas fa-exclamation-circle text-xs text-red-400"></i>
          </div>
          <p class="text-sm text-red-300">{{ form.errors }}</p>
        </div>
        {% endif %}

        <!-- Row 1: Name & Email -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
              <i class="fas fa-user text-indigo-400 mr-1"></i> Your Name *
            </label>
            <input type="text" name="Name" class="input-dark" placeholder="Varun Pingle" required>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
              <i class="fas fa-envelope text-indigo-400 mr-1"></i> Your Email *
            </label>
            <input type="email" name="Email" class="input-dark" placeholder="example@example.com" required>
          </div>
        </div>

        <!-- Row 2: Phone & Institute -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
              <i class="fas fa-phone text-indigo-400 mr-1"></i> Phone Number *
            </label>
            <input type="tel" name="Phone" class="input-dark" placeholder="9876543210" required
                   pattern="[6-9]{1}[0-9]{9}" title="Enter valid 10-digit mobile number">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
              <i class="fas fa-building text-indigo-400 mr-1"></i> Institute / Organization *
            </label>
            <input type="text" name="Institute" class="input-dark" placeholder="Your Organization" required>
          </div>
        </div>

        <!-- Message -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
            <i class="fas fa-comment-dots text-indigo-400 mr-1"></i> Your Message *
          </label>
          <textarea name="Message" rows="4" class="input-dark" placeholder="Tell us how we can help you..." required></textarea>
        </div>

        <!-- Submit Button -->
        <div class="text-center pt-2">
          <button type="submit"
                  class="inline-flex items-center justify-center gap-2 px-10 py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-cyan-500 text-white font-bold text-sm hover:shadow-2xl hover:shadow-indigo-500/30 hover:-translate-y-1 transition-all duration-500 group">
            <i class="fas fa-paper-plane group-hover:translate-x-1 transition-transform duration-300"></i>
            Request Free Consultation
          </button>
        </div>

      </form>

    </div>
  </div>

  {% include "exam/footer.html" %}

</body>
</html>
