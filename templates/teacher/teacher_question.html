{% extends 'teacher/teacherbase.html' %}
{% block content %}

<div class="max-w-7xl mx-auto px-4 py-8">

  <!-- Header -->
  <div class="mb-8">
  <button
    onclick="history.back()"
    class="group inline-flex items-center gap-2 px-5 py-2.5 mb-6 rounded-2xl
           bg-white/5 border border-white/10 text-slate-300
           hover:bg-indigo-500/10 hover:border-indigo-500/30 hover:text-white
           transition-all duration-300 text-sm font-medium shadow-lg shadow-black/20">
    <i class="fas fa-arrow-left text-sm transition-transform duration-300
              group-hover:-translate-x-1"></i>
    <span>Back</span>
  </button>

  <div class="flex items-center gap-2 text-sm text-slate-500 mb-4">
    <a href="/teacher/teacher-dashboard"><i class="fas fa-home text-xs"></i></a>
    <span>/</span>
    <span class="text-slate-300">Questions</span>
  </div>

  <div class="flex items-center gap-4">
    <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center shadow-xl">
      <i class="fas fa-question text-white"></i>
    </div>
    <div>
      <h1 class="text-3xl font-bold text-white">Manage Questions</h1>
      <p class="text-slate-400 text-sm">Create and manage exam questions</p>
    </div>
  </div>
</div>

  <!-- Cards -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <!-- ADD QUESTION -->
    <a href="{% url 'teacher-add-question-list' %}">
      <div class="flex items-center justify-between p-6 rounded-2xl
                  bg-white/[0.03] border border-white/10
                  backdrop-blur-xl hover:border-emerald-400/40
                  hover:shadow-lg hover:shadow-emerald-500/10
                  transition-all duration-300">

        <div>
          <h3 class="text-lg font-semibold text-white mb-1">
            Add Question
          </h3>
          <p class="text-sm text-slate-400">
            Create new questions and assign them to courses
          </p>
        </div>

        <div class="w-14 h-14 flex items-center justify-center
                    rounded-xl bg-emerald-500 text-white text-xl shadow-lg">
          <i class="fas fa-plus"></i>
        </div>

      </div>
    </a>

    <!-- VIEW QUESTION -->
    <a href="{% url 'teacher-view-question' %}">
      <div class="flex items-center justify-between p-6 rounded-2xl
                  bg-white/[0.03] border border-white/10
                  backdrop-blur-xl hover:border-indigo-400/40
                  hover:shadow-lg hover:shadow-indigo-500/10
                  transition-all duration-300">

        <div>
          <h3 class="text-lg font-semibold text-white mb-1">
            View Questions
          </h3>
          <p class="text-sm text-slate-400">
            Browse, edit, and manage all existing questions
          </p>
        </div>

        <div class="w-14 h-14 flex items-center justify-center
                    rounded-xl bg-gradient-to-br from-indigo-500 to-cyan-400
                    text-white text-xl shadow-lg">
          <i class="fas fa-eye"></i>
        </div>

      </div>
    </a>

  </div>

</div>

{% endblock content %}
