<!DOCTYPE html>
{% load static %}
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="utf-8">
  <title>Teacher Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            surface: {
              950: '#020617',
              900: '#0f172a',
              800: '#1e293b',
              700: '#334155',
            }
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out',
            'slide-in': 'slideIn 0.3s ease-out',
            'glow': 'glow 2s ease-in-out infinite alternate',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            slideIn: {
              '0%': { transform: 'translateX(-100%)' },
              '100%': { transform: 'translateX(0)' },
            },
            glow: {
              '0%': { boxShadow: '0 0 5px rgba(99, 102, 241, 0.2)' },
              '100%': { boxShadow: '0 0 20px rgba(99, 102, 241, 0.4)' },
            }
          }
        }
      }
    }
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Sidebar scrollbar */
    #sidebar::-webkit-scrollbar {
      width: 4px;
    }

    /* Glassmorphism utility */
    .glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .glass-strong {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Smooth transitions for sidebar */
    #sidebar {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Active nav link indicator */
    .nav-link-active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(99, 102, 241, 0.05));
      border-left: 3px solid #6366f1;
    }

    /* Gradient text */
    .gradient-text {
      background: linear-gradient(135deg, #818cf8, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Ambient background orbs */
    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.07;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>

<body class="bg-surface-950 text-slate-200 antialiased overflow-x-hidden">

  <!-- ================= AMBIENT BACKGROUND EFFECTS ================= -->
  <div class="ambient-orb w-96 h-96 bg-indigo-600 -top-48 -left-48"></div>
  <div class="ambient-orb w-80 h-80 bg-cyan-500 top-1/2 -right-40"></div>
  <div class="ambient-orb w-72 h-72 bg-purple-600 -bottom-36 left-1/3"></div>

  <!-- ================= HEADER / TOP NAVBAR ================= -->
  <header class="fixed top-0 left-0 right-0 h-16 z-50 glass-strong">
    <div class="flex items-center justify-between h-full px-4 lg:px-6">

      <!-- Left: Menu Toggle + Brand -->
      <div class="flex items-center gap-3">
        <!-- Mobile menu toggle -->
        <button
          id="menuToggleBtn"
          onclick="toggleSidebar()"
          class="lg:hidden flex items-center justify-center w-10 h-10 rounded-xl
                 text-slate-300 hover:text-white hover:bg-white/10
                 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
          aria-label="Toggle menu"
        >
          <i class="fas fa-bars text-lg" id="menuIcon"></i>
        </button>

        <!-- Brand -->
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-cyan-400
                      flex items-center justify-center shadow-lg shadow-indigo-500/20">
            <i class="fas fa-graduation-cap text-white text-sm"></i>
          </div>
          <span class="text-lg font-bold tracking-tight">
            <span class="gradient-text">Online</span>
            <span class="text-white ml-1">Exam</span>
          </span>
        </div>
      </div>

      <!-- Right: User Actions -->
      <div class="flex items-center gap-3">
        <!-- Notification bell (decorative) -->
        <button class="relative flex items-center justify-center w-10 h-10 rounded-xl
                       text-slate-400 hover:text-white hover:bg-white/10
                       transition-all duration-200">
          <i class="fas fa-bell text-sm"></i>
          <span class="absolute top-2 right-2 w-2 h-2 bg-indigo-500 rounded-full
                       ring-2 ring-surface-950"></span>
        </button>

        <!-- User avatar (visible on desktop) -->
        <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-white/5
                    border border-white/10">
          <img
            src="{% static 'images/teacher.png' %}"
            alt="Profile"
            class="w-7 h-7 rounded-lg object-cover ring-2 ring-indigo-500/30"
          >
          <span class="text-sm font-medium text-slate-200">{{ request.user.first_name }}</span>
        </div>

        <!-- Logout Button -->
        <a
          href="/logout"
          class="group flex items-center gap-2 px-4 py-2 rounded-xl
                 bg-red-500/10 text-red-400 border border-red-500/20
                 hover:bg-red-500 hover:text-white hover:border-red-500
                 hover:shadow-lg hover:shadow-red-500/25
                 transition-all duration-300 text-sm font-medium"
        >
          <i class="fas fa-sign-out-alt text-xs transition-transform duration-300
                    group-hover:translate-x-0.5"></i>
          <span class="hidden sm:inline">Logout</span>
        </a>
      </div>
    </div>

    <!-- Bottom border glow -->
    <div class="absolute bottom-0 left-0 right-0 h-px bg-gradient-to-r
                from-transparent via-indigo-500/30 to-transparent"></div>
  </header>

  <!-- ================= SIDEBAR ================= -->
  <aside
    id="sidebar"
    class="fixed top-16 left-0 w-72 h-[calc(100vh-4rem)] z-40
           glass-strong overflow-y-auto
           -translate-x-full lg:translate-x-0"
  >
    <!-- Profile Section -->
    <div class="px-6 py-8">
      <div class="flex flex-col items-center">
        <!-- Avatar with glow ring -->
        <div class="relative group">
          <div class="absolute -inset-1 bg-gradient-to-r from-indigo-500 to-cyan-400
                      rounded-full opacity-30 group-hover:opacity-60 blur-sm
                      transition-opacity duration-500"></div>
          <img
            src="{% static 'images/teacher.png' %}"
            alt="Profile"
            class="relative w-20 h-20 rounded-full object-cover
                   ring-2 ring-white/10 group-hover:ring-indigo-500/50
                   transition-all duration-500"
          >
          <!-- Online indicator -->
          <div class="absolute bottom-1 right-1 w-4 h-4 bg-emerald-500 rounded-full
                      ring-3 ring-surface-950"></div>
        </div>

        <h6 class="mt-4 text-base font-semibold text-white">
          {{ request.user.first_name }}
        </h6>
        <span class="inline-flex items-center gap-1.5 mt-1.5 px-3 py-1 rounded-full
                     bg-indigo-500/10 border border-indigo-500/20
                     text-xs font-medium text-indigo-300">
          <i class="fas fa-chalkboard-teacher text-[10px]"></i>
          Teacher
        </span>
      </div>
    </div>

    <!-- Divider -->
    <div class="mx-6 h-px bg-gradient-to-r from-transparent via-white/10 to-transparent"></div>

    <!-- Navigation Label -->
    <div class="px-6 pt-6 pb-2">
      <span class="text-[11px] font-semibold uppercase tracking-widest text-slate-500">
        Navigation
      </span>
    </div>

    <!-- Navigation Links -->
    <nav class="px-3 pb-6 space-y-1">
      <a
        href="/teacher/teacher-dashboard"
        onclick="toggleSidebar()"
        class="group flex items-center gap-3 px-4 py-3 rounded-xl
               text-slate-300 hover:text-white
               hover:bg-gradient-to-r hover:from-indigo-500/15 hover:to-transparent
               transition-all duration-300 relative overflow-hidden"
      >
        <div class="flex items-center justify-center w-9 h-9 rounded-lg
                    bg-white/5 group-hover:bg-indigo-500/20
                    transition-all duration-300">
          <i class="fas fa-tachometer-alt text-sm text-slate-400 group-hover:text-indigo-400
                    transition-colors duration-300"></i>
        </div>
        <span class="text-sm font-medium">Dashboard</span>
        <!-- Hover indicator -->
        <div class="absolute right-3 w-1.5 h-1.5 rounded-full bg-indigo-500
                    opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
      </a>

      <a
        href="/teacher/teacher-exam"
        onclick="toggleSidebar()"
        class="group flex items-center gap-3 px-4 py-3 rounded-xl
               text-slate-300 hover:text-white
               hover:bg-gradient-to-r hover:from-indigo-500/15 hover:to-transparent
               transition-all duration-300 relative overflow-hidden"
      >
        <div class="flex items-center justify-center w-9 h-9 rounded-lg
                    bg-white/5 group-hover:bg-indigo-500/20
                    transition-all duration-300">
          <i class="fas fa-book text-sm text-slate-400 group-hover:text-indigo-400
                    transition-colors duration-300"></i>
        </div>
        <span class="text-sm font-medium">Manage Courses</span>
        <div class="absolute right-3 w-1.5 h-1.5 rounded-full bg-indigo-500
                    opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
      </a>

      <a
        href="/teacher/teacher-question"
        onclick="toggleSidebar()"
        class="group flex items-center gap-3 px-4 py-3 rounded-xl
               text-slate-300 hover:text-white
               hover:bg-gradient-to-r hover:from-indigo-500/15 hover:to-transparent
               transition-all duration-300 relative overflow-hidden"
      >
        <div class="flex items-center justify-center w-9 h-9 rounded-lg
                    bg-white/5 group-hover:bg-indigo-500/20
                    transition-all duration-300">
          <i class="fas fa-question-circle text-sm text-slate-400 group-hover:text-indigo-400
                    transition-colors duration-300"></i>
        </div>
        <span class="text-sm font-medium">Manage Questions</span>
        <div class="absolute right-3 w-1.5 h-1.5 rounded-full bg-indigo-500
                    opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
      </a>

      <a
        href="/teacher/teacher-view-results"
        onclick="toggleSidebar()"
        class="group flex items-center gap-3 px-4 py-3 rounded-xl
               text-slate-300 hover:text-white
               hover:bg-gradient-to-r hover:from-indigo-500/15 hover:to-transparent
               transition-all duration-300 relative overflow-hidden"
      >
        <div class="flex items-center justify-center w-9 h-9 rounded-lg
                    bg-white/5 group-hover:bg-indigo-500/20
                    transition-all duration-300">
          <i class="fas fa-chart-bar text-sm text-slate-400 group-hover:text-indigo-400
                    transition-colors duration-300"></i>
        </div>
        <span class="text-sm font-medium">Student Results</span>
        <div class="absolute right-3 w-1.5 h-1.5 rounded-full bg-indigo-500
                    opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
      </a>
    </nav>

    <!-- Sidebar Footer -->
    <div class="absolute bottom-0 left-0 right-0 p-4">
      <div class="mx-1 h-px bg-gradient-to-r from-transparent via-white/10 to-transparent mb-4"></div>
      <div class="px-3 flex items-center gap-2 text-slate-500">
        <i class="fas fa-shield-alt text-[10px]"></i>
        <span class="text-[11px]">Secure Portal v2.0</span>
      </div>
    </div>

    <!-- Right border glow -->
    <div class="absolute top-0 right-0 bottom-0 w-px bg-gradient-to-b
                from-transparent via-indigo-500/20 to-transparent"></div>
  </aside>

  <!-- ================= MOBILE OVERLAY ================= -->
  <div
    id="overlay"
    onclick="toggleSidebar()"
    class="fixed inset-0 top-16 z-30 bg-black/60 backdrop-blur-sm
           opacity-0 pointer-events-none
           transition-opacity duration-300 lg:hidden"
  ></div>

  <!-- ================= MAIN CONTENT ================= -->
  <main class="relative z-10 mt-16 lg:ml-72 min-h-[calc(100vh-4rem)]
               transition-all duration-300">
    <div class="p-4 sm:p-6 lg:p-8 animate-fade-in">
      {% block content %}
      {% endblock content %}
    </div>
  </main>

  <!-- ================= SCRIPTS ================= -->
  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");
      const menuIcon = document.getElementById("menuIcon");

      const isOpen = !sidebar.classList.contains("-translate-x-full");

      if (window.innerWidth < 1024) {
        if (isOpen) {
          // Close sidebar
          sidebar.classList.add("-translate-x-full");
          overlay.classList.remove("opacity-100", "pointer-events-auto");
          overlay.classList.add("opacity-0", "pointer-events-none");
          menuIcon.classList.remove("fa-times");
          menuIcon.classList.add("fa-bars");
        } else {
          // Open sidebar
          sidebar.classList.remove("-translate-x-full");
          overlay.classList.remove("opacity-0", "pointer-events-none");
          overlay.classList.add("opacity-100", "pointer-events-auto");
          menuIcon.classList.remove("fa-bars");
          menuIcon.classList.add("fa-times");
        }
      }
    }

    // Close sidebar on window resize to desktop
    window.addEventListener("resize", function () {
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");
      const menuIcon = document.getElementById("menuIcon");

      if (window.innerWidth >= 1024) {
        sidebar.classList.remove("-translate-x-full");
        overlay.classList.remove("opacity-100", "pointer-events-auto");
        overlay.classList.add("opacity-0", "pointer-events-none");
        menuIcon.classList.remove("fa-times");
        menuIcon.classList.add("fa-bars");
      } else {
        if (!sidebar.classList.contains("-translate-x-full")) {
          // If sidebar was open on mobile after resize, keep it consistent
        } else {
          sidebar.classList.add("-translate-x-full");
        }
      }
    });

    // Highlight current nav link
    document.addEventListener("DOMContentLoaded", function () {
      const currentPath = window.location.pathname;
      const navLinks = document.querySelectorAll("#sidebar nav a");

      navLinks.forEach(function (link) {
        const href = link.getAttribute("href");
        if (currentPath === href || currentPath.startsWith(href + "/")) {
          // Add active state
          link.classList.add("bg-gradient-to-r", "from-indigo-500/20", "to-transparent", "text-white");
          link.classList.add("border-l-2", "border-indigo-500");

          // Update icon color
          const iconDiv = link.querySelector("div");
          if (iconDiv) {
            iconDiv.classList.remove("bg-white/5");
            iconDiv.classList.add("bg-indigo-500/20");
          }
          const icon = link.querySelector("i");
          if (icon) {
            icon.classList.remove("text-slate-400");
            icon.classList.add("text-indigo-400");
          }

          // Show indicator dot
          const dot = link.querySelector(".bg-indigo-500");
          if (dot) {
            dot.classList.remove("opacity-0");
            dot.classList.add("opacity-100");
          }
        }
      });
    });
  </script>

</body>

</html>
