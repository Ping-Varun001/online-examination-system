{% extends 'teacher/teacherbase.html' %}
{% block content %}

<!-- ================= HEADER ================= -->
<div class="mb-8">
  <button onclick="history.back()" class="group inline-flex items-center gap-2 px-5 py-2.5 mb-6 rounded-2xl
         bg-white/5 border border-white/10 text-slate-300
         hover:bg-indigo-500/10 hover:border-indigo-500/30 hover:text-white
         transition-all duration-300 text-sm font-medium shadow-lg shadow-black/20">
    <i class="fas fa-arrow-left group-hover:-translate-x-1 transition"></i>
    <span>Back</span>
  </button>

  <div class="flex items-center gap-2 text-sm text-slate-500 mb-4">
    <a href="/teacher/teacher-dashboard"><i class="fas fa-home text-xs"></i></a>
    <span>/</span>
    <span class="text-slate-300">Courses</span>
  </div>

  <div class="flex items-center gap-4">
    <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-500 to-cyan-400 flex items-center justify-center shadow-xl">
      <i class="fas fa-book text-white"></i>
    </div>
    <div>
      <h1 class="text-3xl font-bold text-white">Manage Courses</h1>
      <p class="text-slate-400 text-sm">Create and manage your exam courses</p>
    </div>
  </div>
</div>

<!-- ================= ACTION CARDS ================= -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">

  <!-- ================= ADD COURSE ================= -->
  <a href="{% url 'teacher-add-exam' %}"
     class="group relative rounded-2xl overflow-hidden
            bg-white/[0.03] backdrop-blur-xl
            border border-white/[0.06]
            hover:border-emerald-500/30 hover:bg-white/[0.06]
            transition-all duration-500 hover:-translate-y-1
            hover:shadow-2xl hover:shadow-emerald-500/10">

    <!-- Glow -->
    <div class="absolute -top-12 -left-12 w-32 h-32 rounded-full
                bg-emerald-500/20 blur-3xl opacity-0
                group-hover:opacity-100 transition duration-700"></div>

    <div class="relative p-6 sm:p-8 flex items-center justify-between">

      <div>
        <h3 class="text-lg font-semibold text-white mb-1">
          Add Course
        </h3>
        <p class="text-sm text-slate-400">
          Create new courses and define exam structure
        </p>
      </div>

      <!-- Icon -->
      <div class="w-14 h-14 rounded-2xl
                  bg-gradient-to-br from-emerald-500 to-green-600
                  flex items-center justify-center
                  shadow-lg shadow-emerald-500/25
                  group-hover:scale-110
                  transition-all duration-500">
        <i class="fas fa-plus text-white text-lg"></i>
      </div>

    </div>

    <!-- Bottom Accent -->
    <div class="absolute bottom-0 left-0 right-0 h-px
                bg-gradient-to-r from-emerald-500/0 via-emerald-500/40 to-emerald-500/0
                opacity-0 group-hover:opacity-100 transition"></div>
  </a>

  <!-- ================= VIEW COURSES ================= -->
  <a href="{% url 'teacher-view-exam' %}"
     class="group relative rounded-2xl overflow-hidden
            bg-white/[0.03] backdrop-blur-xl
            border border-white/[0.06]
            hover:border-indigo-500/30 hover:bg-white/[0.06]
            transition-all duration-500 hover:-translate-y-1
            hover:shadow-2xl hover:shadow-indigo-500/10">

    <!-- Glow -->
    <div class="absolute -top-12 -left-12 w-32 h-32 rounded-full
                bg-indigo-500/20 blur-3xl opacity-0
                group-hover:opacity-100 transition duration-700"></div>

    <div class="relative p-6 sm:p-8 flex items-center justify-between">

      <div>
        <h3 class="text-lg font-semibold text-white mb-1">
          View Courses
        </h3>
        <p class="text-sm text-slate-400">
          Browse, review, and manage existing courses
        </p>
      </div>

      <!-- Icon -->
      <div class="w-14 h-14 rounded-2xl
                  bg-gradient-to-br from-indigo-500 to-cyan-400
                  flex items-center justify-center
                  shadow-lg shadow-indigo-500/25
                  group-hover:scale-110
                  transition-all duration-500">
        <i class="fas fa-eye text-white text-lg"></i>
      </div>

    </div>

    <!-- Bottom Accent -->
    <div class="absolute bottom-0 left-0 right-0 h-px
                bg-gradient-to-r from-indigo-500/0 via-indigo-500/40 to-indigo-500/0
                opacity-0 group-hover:opacity-100 transition"></div>
  </a>

</div>

{% endblock content %}
